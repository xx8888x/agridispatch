# 測試共用設定：既有整合測試以示範資料（工班、工人、訂單…）為前提，正式模式的測試類別也需要寫入示範資料。
# 「正式環境不寫示範資料」由 ProductionSeedTest 明確設 agri.seed.demo-data= （空值＝跟隨 demo 模式）驗證。
agri.seed.demo-data=true

# 既有整合測試以含外籍移工的示範資料為前提，預設打開外籍移工功能；
# 下架狀態（agri.features.foreign-workers=false）由 ForeignWorkersDisabledTest 驗證。
agri.features.foreign-workers=true
