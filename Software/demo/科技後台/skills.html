<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智農派工 AgriDispatch - 技能標籤複核</title>
  <script src="js/app-config.js"></script>
  <script src="js/api-client.js"></script>
  <script>
    if (window.AgriAuth) window.AgriAuth.requireRole(['admin_tech'], 'admin-login.html');
  </script>
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記、圖示、抽屜 -->
  <script src="js/agri-theme.js"></script>
  <!-- Lucide 圖示：本機 vendor 優先，CDN 備援 -->
  <script src="js/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@1.47.0"><\/script>');
    }
  </script>
  <link rel="stylesheet" href="css/agri.css">
</head>
<body class="ad-body ad-has-tabbar min-h-screen flex flex-col">

  <header class="ad-header">
    <div class="ad-container ad-header__inner" style="max-width: 1280px;">
      <a href="admin.html" class="ad-header__brand">
        <span class="ad-header__logo"><i data-lucide="sprout" class="ad-icon"></i></span>
        智農派工
        <span class="ad-header__role">營運後台</span>
      </a>
      <nav class="ad-nav" aria-label="營運工具">
        <a class="ad-nav__link" href="insurance.html">保險登錄</a>
        <a class="ad-nav__link is-active" href="skills.html">技能複核</a>
        <a class="ad-nav__link" href="matching.html">派工媒合</a>
      </nav>
      <div class="ad-header__actions">
        <button type="button" class="ad-btn ad-btn--ghost ad-btn--sm" data-demo-only onclick="demoNav.open()" aria-label="示範導覽"><i data-lucide="layout-grid" class="ad-icon ad-icon--sm"></i><span class="ad-hide-sm">示範導覽</span></button>
        <a href="admin.html" class="ad-btn ad-btn--secondary ad-btn--sm"><i data-lucide="arrow-left" class="ad-icon ad-icon--sm"></i>回後台</a>
      </div>
    </div>
  </header>

  <nav class="ad-tabbar" aria-label="營運工具">
    <a class="ad-tabbar__item" href="insurance.html"><i data-lucide="shield-check" class="ad-icon"></i>保險登錄</a>
    <a class="ad-tabbar__item is-active" href="skills.html"><i data-lucide="award" class="ad-icon"></i>技能複核</a>
    <a class="ad-tabbar__item" href="matching.html"><i data-lucide="route" class="ad-icon"></i>派工媒合</a>
    <a class="ad-tabbar__item" href="admin.html"><i data-lucide="layout-dashboard" class="ad-icon"></i>後台</a>
  </nav>

  <main class="flex-1 ad-container w-full" style="max-width: 1280px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 20px;">
    <div style="min-width: 0;">
      <h1 class="ad-display">技能標籤與複核</h1>
      <p class="ad-caption" style="margin-top: 6px; max-width: 820px;">依出勤時數、訂單數、工班評價與領班逐人評核自動判定。被暫停的標籤需由合作社確認原因（面談、補訓）後按「複核恢復」；恢復前的評價不再觸發暫停，但該工人 6 個月內不給「履歷認證」。</p>
      <p class="ad-caption" style="margin-top: 6px; color: var(--ad-accent-text); max-width: 820px;">【待確認】標籤只用於派工媒合優先順序，不得作為扣薪、解僱或差別待遇依據。</p>
    </div>
    <div id="loadError" class="ad-notice ad-notice--danger" role="alert" hidden></div>
    <div id="kpiRow" class="ad-stat-grid"></div>

    <section>
      <h2 class="ad-title" style="margin-bottom: 10px;">暫停中待複核</h2>
      <div id="suspended" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </section>

    <div class="ad-card" style="padding: 8px 16px; overflow-x: auto;">
      <table class="ad-table" style="min-width: 760px;">
        <thead>
          <tr><th>工人</th><th>履歷認證</th><th>採收</th><th>修剪套袋</th><th>整地定植</th><th>包裝</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" style="text-align: center; padding: 32px 12px; color: var(--ad-text-3);">載入中…</td></tr></tbody>
      </table>
    </div>
  </main>

  <script>
    const KEYS = ['harvest', 'pruning', 'tillage', 'packing'];
    let profiles = [];
    const base = () => (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';
    // 後端標籤名稱可能帶 emoji，介面上不顯示
    const plain = s => String(s == null ? '' : s).replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu, '').trim();
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    async function api(path, options) {
      const res = await fetch(`${base()}${path}`, options);
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.success === false) throw new Error(body.error || `HTTP ${res.status}`);
      return body.data;
    }

    async function load() {
      try {
        profiles = await api('/skills/workers');
        document.getElementById('loadError').hidden = true;
      } catch (e) {
        const el = document.getElementById('loadError');
        el.textContent = `無法載入：${e.message}（請確認後端 3000 已啟動，且以管理員身分登入）`;
        el.hidden = false;
        return;
      }
      render();
    }

    function cell(s) {
      const sub = `<div class="ad-caption ad-num">${s.hours}h・${s.orders} 單</div>`;
      if (s.suspended) return `<span class="ad-pill ad-pill--danger">暫停</span>${sub}`;
      if (s.level === 'senior') return `<span class="ad-pill ad-pill--warn">資深熟手</span>${sub}`;
      if (s.level === 'skilled') return `<span class="ad-pill ad-pill--ok">熟手</span>${sub}`;
      return s.hours > 0 ? `<span class="ad-caption ad-num">${s.hours}h／80</span>` : '<span class="ad-caption" style="color: var(--ad-text-3);">—</span>';
    }

    function render() {
      const all = profiles.flatMap(p => p.skills.map(s => ({ p, s })));
      const active = all.filter(x => x.s.active);
      const suspended = all.filter(x => x.s.suspended);
      const tiles = [
        ['工人數', profiles.length, ''],
        ['履歷認證', profiles.filter(p => p.verified).length, 'ad-stat--primary'],
        ['有效熟手標籤', active.length, 'ad-stat--primary'],
        ['暫停待複核', suspended.length, suspended.length ? 'ad-stat--danger' : '']
      ];
      document.getElementById('kpiRow').innerHTML = tiles.map(([k, v, c]) => `
        <div class="ad-stat ${c}"><div class="ad-stat__label">${k}</div><div class="ad-stat__value">${v}</div></div>`).join('');

      document.getElementById('suspended').innerHTML = suspended.length ? suspended.map(({ p, s }) => `
        <div class="ad-card" style="border-color: var(--ad-danger); padding: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
          <div style="min-width: 0;">
            <div class="ad-heading" style="font-size: 15px;">${esc(p.name)} <span class="ad-caption ad-num" style="font-weight: 400;">${esc(p.workerId)}</span>・${esc(plain(s.label))}</div>
            <div class="ad-caption" style="color: var(--ad-danger-text);">${s.suspendReasons.map(esc).join('；')}</div>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
            <input type="text" maxlength="200" placeholder="複核說明（例：已面談並補訓）" aria-label="複核說明" data-note-for="${esc(p.workerId)}-${esc(s.key)}" class="ad-input" style="width: 240px; max-width: 100%;">
            <button type="button" data-worker="${esc(p.workerId)}" data-skill="${esc(s.key)}" onclick="restore(this)" class="ad-btn ad-btn--primary ad-btn--sm">複核恢復</button>
          </div>
        </div>`).join('') : '<div class="ad-empty"><div class="ad-empty__title">目前沒有暫停中的標籤</div></div>';

      document.getElementById('rows').innerHTML = profiles.map(p => {
        const byKey = Object.fromEntries(p.skills.map(s => [s.key, s]));
        return `<tr>
          <td><div style="font-weight: 600;">${esc(p.name)}</div><div class="ad-caption ad-num">${esc(p.workerId)}・${esc(p.teamId || '—')}</div></td>
          <td>${p.verified ? '<span class="ad-pill ad-pill--ok">已認證</span>' : `<span class="ad-pill ad-pill--warn" title="${esc(p.unverifiedReasons.join('；'))}">未通過</span>`}</td>
          ${KEYS.map(k => `<td>${cell(byKey[k])}</td>`).join('')}
        </tr>`;
      }).join('');
    }

    async function restore(btn) {
      const note = [...document.querySelectorAll('[data-note-for]')].find(el => el.dataset.noteFor === `${btn.dataset.worker}-${btn.dataset.skill}`).value.trim();
      if (!note) { alert('請填寫複核說明（例如：已面談並補訓）'); return; }
      btn.disabled = true;
      try {
        await api(`/skills/workers/${encodeURIComponent(btn.dataset.worker)}/${encodeURIComponent(btn.dataset.skill)}/restore`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ note })
        });
        await load();
      } catch (e) {
        alert(`複核失敗：${e.message}`);
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', load);
  </script>

  <script>
    var demoNav = AgriTheme.demoNav();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
