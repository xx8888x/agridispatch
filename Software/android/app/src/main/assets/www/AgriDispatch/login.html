<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智農派工 AgriDispatch - 角色專屬身分登入大廳</title>
  <!-- 執行模式設定（demo / production，每份副本各自一份） -->
  <script src="js/app-config.js"></script>
  <!-- API Client：自動帶 token、demo 自動登入、production 401 導向 -->
  <script src="js/api-client.js"></script>
  <script>
    if (window.AGRI_CONFIG && window.AGRI_CONFIG.mode !== 'production') {
      document.write('<script src="js/demo-accounts.js"><\/script>');
    }
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記、圖示 -->
  <script src="js/agri-theme.js"></script>
  <!-- Lucide 圖示：本機 vendor 優先，CDN 備援（只用在 Vue 區塊外） -->
  <script src="js/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@1.47.0"><\/script>');
    }
  </script>
  <!-- Vue 3: Local Vendor First with CDN Fallback -->
  <script src="js/vendor/vue.global.prod.js"></script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>');
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/agri.css">
  <style>
    [v-cloak] { display: none; }
  </style>
  <script>
    // Failsafe: Remove v-cloak if Vue takes more than 1.5s to prevent blank screen
    setTimeout(function() {
      var appEl = document.getElementById('app');
      if (appEl && appEl.hasAttribute('v-cloak')) {
        console.warn('Vue mounting timed out or offline, removing v-cloak failsafe');
        appEl.removeAttribute('v-cloak');
      }
    }, 1500);
  </script>
</head>
<body class="ad-body min-h-screen flex flex-col">

  <!-- 表頭：一條 56px。連線狀態只在 demo 顯示。 -->
  <header class="ad-header">
    <div class="ad-container ad-header__inner">
      <a href="index.html" class="ad-header__brand">
        <span class="ad-header__logo"><i data-lucide="sprout" class="ad-icon"></i></span>
        智農派工
      </a>
      <div class="ad-header__actions">
        <span id="serverStatusBadge" class="ad-pill" data-demo-only><span class="ad-pill__dot"></span>檢查連線中</span>
      </div>
    </div>
  </header>

  <!-- 身分選擇：與 Android 原生身分選擇畫面同一套文案（06_Android雙端App規格書 4.1）。
       第一層問「你是哪一位？」；本國工人再選一種工作。泰國、菲律賓未開放【待確認】，不顯示。 -->
  <main class="flex-1 ad-container w-full" style="padding-block: 32px 40px;">
    <div style="max-width: 560px; margin-inline: auto;">

      <section id="stepRole" aria-labelledby="stepRoleTitle">
        <h1 id="stepRoleTitle" class="ad-display">你是哪一位？</h1>
        <nav style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px;" aria-label="身分">
        <a href="farmer-login.html" class="ad-card ad-card--interactive" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
          <span class="ad-icon-box"><i data-lucide="sprout" class="ad-icon"></i></span>
          <span style="flex: 1; min-width: 0;">
            <span class="ad-heading" style="display: block;">我是農場主</span>
            <span class="ad-caption" style="display: block;">我要找人手</span>
          </span>
          <i data-lucide="chevron-right" class="ad-icon ad-icon--sm ad-text-3"></i>
        </a>
        <a href="#local" class="ad-card ad-card--interactive" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
          <span class="ad-icon-box"><i data-lucide="hard-hat" class="ad-icon"></i></span>
          <span style="flex: 1; min-width: 0;">
            <span class="ad-heading" style="display: block;">我是本國工人</span>
            <span class="ad-caption" style="display: block;">我要接農務工作</span>
          </span>
          <i data-lucide="chevron-right" class="ad-icon ad-icon--sm ad-text-3"></i>
        </a>
        <a href="worker-foreign-login.html?lang=vi" class="ad-card ad-card--interactive" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
          <span class="ad-icon-box"><span style="font-weight: 700; font-size: 14px; letter-spacing: 0.02em;">VI</span></span>
          <span style="flex: 1; min-width: 0;">
            <span class="ad-heading" style="display: block;" lang="vi">Tôi là lao động Việt Nam</span>
            <span class="ad-caption" style="display: block;">越南籍工人</span>
          </span>
          <i data-lucide="chevron-right" class="ad-icon ad-icon--sm ad-text-3"></i>
        </a>
        <a href="worker-foreign-login.html?lang=id" class="ad-card ad-card--interactive" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
          <span class="ad-icon-box"><span style="font-weight: 700; font-size: 14px; letter-spacing: 0.02em;">ID</span></span>
          <span style="flex: 1; min-width: 0;">
            <span class="ad-heading" style="display: block;" lang="id">Saya pekerja Indonesia</span>
            <span class="ad-caption" style="display: block;">印尼籍工人</span>
          </span>
          <i data-lucide="chevron-right" class="ad-icon ad-icon--sm ad-text-3"></i>
        </a>
        </nav>
      </section>

      <section id="stepLocal" aria-labelledby="stepLocalTitle" hidden>
        <a href="#" class="ad-btn ad-btn--ghost" style="margin-left: -12px; margin-bottom: 8px;"><i data-lucide="arrow-left" class="ad-icon ad-icon--sm"></i>上一步</a>
        <h1 id="stepLocalTitle" class="ad-display">我是本國工人</h1>
        <p class="ad-caption" style="margin-top: 6px;">你主要做哪一種工作？</p>
        <nav style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px;" aria-label="工作類別">
        <a href="worker-local-login.html?role=labor" class="ad-card ad-card--interactive" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
          <span class="ad-icon-box"><i data-lucide="wheat" class="ad-icon"></i></span>
          <span style="flex: 1; min-width: 0;">
            <span class="ad-heading" style="display: block;">一般農務</span>
            <span class="ad-caption" style="display: block;">採收、包裝、套袋</span>
          </span>
          <i data-lucide="chevron-right" class="ad-icon ad-icon--sm ad-text-3"></i>
        </a>
        <a href="worker-local-login.html?role=foreman" class="ad-card ad-card--interactive" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
          <span class="ad-icon-box"><i data-lucide="users" class="ad-icon"></i></span>
          <span style="flex: 1; min-width: 0;">
            <span class="ad-heading" style="display: block;">帶班師傅</span>
            <span class="ad-caption" style="display: block;">帶領外籍工班</span>
          </span>
          <i data-lucide="chevron-right" class="ad-icon ad-icon--sm ad-text-3"></i>
        </a>
        <a href="worker-local-login.html?role=machinery" class="ad-card ad-card--interactive" style="display: flex; align-items: center; gap: 12px; padding: 16px;">
          <span class="ad-icon-box"><i data-lucide="tractor" class="ad-icon"></i></span>
          <span style="flex: 1; min-width: 0;">
            <span class="ad-heading" style="display: block;">農機操作</span>
            <span class="ad-caption" style="display: block;">曳引機、無人機</span>
          </span>
          <i data-lucide="chevron-right" class="ad-icon ad-icon--sm ad-text-3"></i>
        </a>
        </nav>
      </section>

      <div id="app" v-cloak>
        <p v-if="isDemo" data-demo-only class="ad-caption" style="margin-top: 20px; text-align: center;">示範模式：每個登入頁都能一鍵填入示範帳號。</p>
      </div>
    </div>
  </main>

  <footer class="ad-caption" style="padding: 12px 16px 20px; text-align: center; border-top: 1px solid var(--ad-border);">
    <a href="../TechBackend/admin-login.html" class="ad-btn ad-btn--ghost ad-btn--sm">管理人員登入</a>
    <div style="margin-top: 4px;">© 2026 智農派工 AgriDispatch</div>
  </footer>

  <script>
    // 兩層切換用網址 #local，瀏覽器「上一頁」也能回到第一層
    (function () {
      function render() {
        var local = location.hash === '#local';
        document.getElementById('stepRole').hidden = local;
        document.getElementById('stepLocal').hidden = !local;
      }
      window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
      render();
    })();
  </script>

  <script>
    if (typeof Vue !== 'undefined') {
      const { createApp, onMounted, ref } = Vue;
      createApp({
        setup() {
          const isOnline = ref(true);
          const isDemo = window.AgriAuth ? window.AgriAuth.MODE !== 'production' : true;
          const API_BASE = window.AgriAuth ? window.AgriAuth.API_BASE : '/api';
          const checkBackend = async () => {
            try {
              const res = await fetch(`${API_BASE}/crops`, { signal: AbortSignal.timeout(2500) });
              if (res.ok) {
                isOnline.value = true;
                const badge = document.getElementById('serverStatusBadge');
                if (badge) {
                  badge.className = 'ad-pill ad-pill--ok';
                  badge.innerHTML = '<span class="ad-pill__dot"></span>伺服器在線';
                }
              }
            } catch (e) {
              isOnline.value = false;
              const badge = document.getElementById('serverStatusBadge');
              if (badge) {
                badge.className = 'ad-pill ad-pill--warn';
                badge.innerHTML = '<span class="ad-pill__dot"></span>離線模式';
              }
            }
          };

          onMounted(() => {
            checkBackend();
          });

          return { isOnline, isDemo };
        }
      }).mount('#app');
    }
  </script>
</body>
</html>
