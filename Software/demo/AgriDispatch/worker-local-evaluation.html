<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="智農派工領班逐人評核：評核工班組員的出勤與作業表現。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>智農派工 AgriDispatch - 領班逐人評核</title>
  <script src="js/app-config.js"></script>
  <script src="js/api-client.js"></script>
  <script>
    if (window.AgriAuth) window.AgriAuth.requireRole(['worker_local', 'worker_foreign', 'admin_tech'], 'worker-local-login.html');
  </script>
  <!-- 設計系統 -->
  <script src="js/agri-theme.js"></script>
  <link rel="stylesheet" href="css/agri.css">
</head>
<body class="ad-body min-h-screen flex flex-col">

  <header class="ad-header">
    <div class="ad-container ad-header__inner" style="max-width: 768px;">
      <a href="worker-local.html" class="ad-btn ad-btn--ghost ad-btn--sm">← 回工作台</a>
      <a href="worker-skills.html" class="ad-btn ad-btn--ghost ad-btn--sm" style="color: var(--ad-primary-text);">我的技能進度</a>
    </div>
  </header>

  <main class="flex-1 ad-container w-full" style="max-width: 768px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 20px;">
    <div>
      <h1 class="ad-display">領班逐人評核</h1>
      <p class="ad-caption" style="margin-top: 6px;">每位工人下班簽核後，請依當天表現評「優／可／需加強」。評核只用於技能標籤與派工媒合，不作為扣薪或解僱依據。
        本人的班次須由同工班其他領班或合作社評核；超過 7 天的班次請洽合作社。</p>
    </div>

    <div class="ad-card" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px;">
      <label for="team" class="ad-label">工班</label>
      <select id="team" onchange="load()" class="ad-select" style="width: auto; min-width: 110px;"></select>
      <label for="day" class="ad-label">日期</label>
      <input id="day" type="date" onchange="load()" class="ad-input" style="width: auto;">
      <div style="display: flex; gap: 6px; margin-left: auto;">
        <button type="button" onclick="shiftDay(-1)" class="ad-btn ad-btn--secondary ad-btn--sm">前一天</button>
        <button type="button" onclick="shiftDay(1)" class="ad-btn ad-btn--secondary ad-btn--sm">後一天</button>
      </div>
    </div>

    <p id="msg" hidden role="status"></p>
    <div id="list" style="display: flex; flex-direction: column; gap: 8px;"></div>
  </main>

  <script>
    // [值, 文字, 額外 class]：評核用分段控制，選中「需加強」以危險色標示
    const OPTIONS = [
      ['excellent', '優', ''],
      ['ok', '可', ''],
      ['needs_improvement', '需加強', ' ad-seg__btn--danger']
    ];
    const base = () => (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';

    async function api(path, options) {
      const res = await fetch(`${base()}${path}`, options);
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.success === false) {
        const msg = body.error === 'FORBIDDEN' ? '沒有權限（只有該工班領班或合作社可以評核）' : (body.error || `HTTP ${res.status}`);
        throw new Error(msg);
      }
      return body.data;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function setMsg(text, ok) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.hidden = !text;
      el.className = text ? `ad-notice ${ok ? 'ad-notice--ok' : 'ad-notice--danger'}` : '';
    }
    function iso(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function shiftDay(n) {
      const el = document.getElementById('day');
      const d = new Date(el.value + 'T00:00:00');
      d.setDate(d.getDate() + n);
      el.value = iso(d);
      load();
    }

    async function load() {
      setMsg('');
      const team = document.getElementById('team').value;
      const day = document.getElementById('day').value;
      const list = document.getElementById('list');
      list.innerHTML = '<p class="ad-caption">載入中…</p>';
      try {
        const data = await api(`/evaluations/teams/${encodeURIComponent(team)}?date=${encodeURIComponent(day)}`);
        if (!data.shifts.length) {
          list.innerHTML = '<div class="ad-empty"><div class="ad-empty__title">這一天沒有出勤紀錄</div>換一天或換工班看看。</div>';
          return;
        }
        list.innerHTML = data.shifts.map(s => {
          const locked = s.self ? '本人班次，請由其他領班或合作社評核' : (!s.clockOut ? '尚未下班簽核' : '');
          const buttons = OPTIONS.map(([val, label, extra]) => `
            <button type="button" data-id="${s.attendanceId}" data-rating="${val}" onclick="rate(this)" ${locked ? 'disabled' : ''}
              class="ad-seg__btn${extra}${s.rating === val ? ' is-active' : ''}" style="padding: 0 14px;" aria-pressed="${s.rating === val}">${label}</button>`).join('');
          return `<div class="ad-card" style="padding: 16px; ${s.rating ? '' : 'border-color: var(--ad-accent);'} display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
              <div style="min-width: 0;">
                <div class="ad-heading" style="font-size: 15px;">${esc(s.name)} <span class="ad-caption ad-num" style="font-weight: 400;">${esc(s.workerId)}</span></div>
                <div class="ad-caption ad-num">${esc(s.clockIn)}–${esc(s.clockOut || '進行中')}${s.hours != null ? `・${s.hours} 小時` : ''}${s.orderId ? `・${esc(s.orderId)}` : ''}</div>
                ${locked ? `<div class="ad-caption" style="color: var(--ad-accent-text);">${locked}</div>` : (!s.rating ? '<div class="ad-caption" style="color: var(--ad-accent-text);">尚未評核</div>' : '')}
              </div>
              <div class="ad-seg" role="group" aria-label="評核">${buttons}</div>
            </div>`;
        }).join('');
      } catch (e) {
        list.innerHTML = '';
        setMsg(`無法載入：${e.message}`, false);
      }
    }

    async function rate(btn) {
      btn.disabled = true;
      try {
        await api(`/evaluations/attendance/${encodeURIComponent(btn.dataset.id)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating: btn.dataset.rating })
        });
        await load();
        setMsg('已儲存評核', true);
      } catch (e) {
        setMsg(`評核未儲存：${e.message}`, false);
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = (() => { try { return JSON.parse(sessionStorage.getItem('agri_user') || '{}'); } catch (e) { return {}; } })();
      const teams = ['team_a', 'team_b', 'team_c', 'team_d'];
      let myTeam = 'team_b';
      // 依登入者工號找出所屬工班（admin 可切換工班）
      if (!user.refId) await fetch(`${base()}/auth/me`).catch(() => null);
      const me = (() => { try { return JSON.parse(sessionStorage.getItem('agri_user') || '{}'); } catch (e) { return {}; } })();
      if (me.refId && /^W\d+/.test(me.refId)) {
        try { myTeam = (await api(`/skills/workers/${encodeURIComponent(me.refId)}`)).teamId || myTeam; } catch (e) {}
      }
      document.getElementById('team').innerHTML = teams.map(t => `<option value="${t}" ${t === myTeam ? 'selected' : ''}>${t}</option>`).join('');
      // 預設顯示昨天（下班簽核通常隔日補評）
      const d = new Date();
      d.setDate(d.getDate() - 1);
      document.getElementById('day').value = iso(d);
      load();
    });
  </script>
</body>
</html>
