<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>農場主專屬登入 - 智農派工 AgriDispatch</title>
  <!-- 執行模式設定（demo / production，每份副本各自一份） -->
  <script src="js/app-config.js"></script>
  <!-- API Client：自動帶 token、demo 自動登入、production 401 導向 -->
  <script src="js/api-client.js"></script>
  <script>
    if (window.AGRI_CONFIG && window.AGRI_CONFIG.mode !== 'production') {
      document.write('<script src="js/demo-accounts.js"><\/script>');
    }
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記、圖示 -->
  <script src="js/agri-theme.js"></script>
  <!-- Lucide 圖示：本機 vendor 優先，CDN 備援（只用在 Vue 區塊外的表頭） -->
  <script src="js/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@1.47.0"><\/script>');
    }
  </script>
  <!-- Vue 3: Local Vendor First with CDN Fallback -->
  <script src="js/vendor/vue.global.prod.js"></script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>');
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/agri.css">
  <style>
    [v-cloak] { display: none; }
  </style>
  <script>
    // Failsafe: Remove v-cloak if Vue takes more than 1.5s to prevent blank screen
    setTimeout(function() {
      var appEl = document.getElementById('app');
      if (appEl && appEl.hasAttribute('v-cloak')) {
        console.warn('Vue mounting timed out or offline, removing v-cloak failsafe');
        appEl.removeAttribute('v-cloak');
      }
    }, 1500);
  </script>
</head>
<body class="ad-body min-h-screen flex flex-col">

  <!-- 表頭：一條 56px。身分切換只在 demo 顯示。 -->
  <header class="ad-header">
    <div class="ad-container ad-header__inner">
      <a href="index.html" class="ad-header__brand">
        <span class="ad-header__logo"><i data-lucide="sprout" class="ad-icon"></i></span>
        智農派工
        <span class="ad-header__role">農場主</span>
      </a>
      <div class="ad-header__actions">
        <a href="login.html" class="ad-btn ad-btn--ghost ad-btn--sm" data-demo-only><i data-lucide="arrow-left-right" class="ad-icon ad-icon--sm"></i>切換身分</a>
      </div>
    </div>
  </header>

  <div id="app" v-cloak class="flex-1 flex flex-col">
    <main class="flex-1 ad-container w-full" style="padding-block: 32px 40px;">
      <div style="max-width: 440px; margin-inline: auto;">
        <h1 class="ad-display">農場主登入</h1>
        <p class="ad-caption" style="margin-top: 6px;">登入後可預約派工、查看訂單。</p>

        <div class="ad-card" style="padding: 24px; margin-top: 24px;">
          <!-- 示範模式提示（僅 demo 模式顯示） -->
          <div v-if="isDemo && demoCfg" data-demo-only style="margin-bottom: 20px;">
            <div class="ad-notice ad-notice--ok">
              <span style="flex: 1;">示範模式，免密碼。</span>
              <a href="farmer.html" style="color: inherit; font-weight: 600; white-space: nowrap;">直接進入</a>
            </div>
          </div>

          <div v-if="errorMsg" class="ad-notice ad-notice--danger" role="alert" style="margin-bottom: 16px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ad-icon ad-icon--sm"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg><span>{{ errorMsg }}</span>
          </div>
          <div v-if="successMsg" class="ad-notice ad-notice--ok" role="status" style="margin-bottom: 16px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ad-icon ad-icon--sm"><circle cx="12" cy="12" r="10"></circle><path d="m16 9-5.5 5.5L8 12"></path></svg><span>{{ successMsg }}</span>
          </div>

          <form @submit.prevent="handleLogin" style="display: flex; flex-direction: column; gap: 16px;">
            <div class="ad-field">
              <label class="ad-label" for="loginId">帳號或手機號碼</label>
              <input id="loginId" v-model="form.identifier" type="text" autocomplete="username" class="ad-input"
                :placeholder="isDemo && demoCfg ? demoCfg.idPlaceholder : '帳號或手機號碼'">
            </div>

            <div class="ad-field">
              <div style="display: flex; align-items: baseline; justify-content: space-between;">
                <label class="ad-label" for="loginPwd">密碼</label>
                <a href="#" @click.prevent="alertHelp" class="ad-caption" style="color: var(--ad-primary-text);">忘記密碼？</a>
              </div>
              <input id="loginPwd" v-model="form.password" type="password" autocomplete="current-password" class="ad-input"
                :placeholder="isDemo && demoCfg ? demoCfg.pwdPlaceholder : '密碼'">
              <span v-if="isDemo && demoCfg" data-demo-only class="ad-hint">{{ demoCfg.pwdHint }}</span>
            </div>

            <button type="submit" :disabled="loading" class="ad-btn ad-btn--primary ad-btn--lg ad-btn--block">
              {{ loading ? '登入中…' : '登入' }}
            </button>
          </form>

          <!-- 示範帳號（僅 demo 模式顯示，資料來自 js/demo-accounts.js） -->
          <div v-if="isDemo && demoCfg" data-demo-only style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--ad-border);">
            <p class="ad-label" style="margin-bottom: 8px;">示範帳號（點一下填入）</p>
            <div class="ad-list">
              <button v-for="p in demoCfg.profiles" :key="p.identifier" type="button" @click="fillProfile(p.identifier, p.password)"
                class="ad-row ad-card--interactive" style="width: 100%; text-align: left; font: inherit;">
                <span class="ad-row__main">
                  <span class="ad-row__title" style="display: block;">{{ p.name }}</span>
                  <span class="ad-row__meta" style="display: block;">{{ p.desc }}</span>
                </span>
                <span class="ad-pill">{{ p.tag }}</span>
              </button>
            </div>
          </div>
        </div>

        <p class="ad-caption" style="margin-top: 20px; text-align: center;">
          還沒有帳號？<a href="farmer-register.html" style="color: var(--ad-primary-text); font-weight: 600;">免費註冊</a>
        </p>
        <p class="ad-caption" style="margin-top: 8px; text-align: center;">
          不是農場主？
          <a href="worker-foreign-login.html" style="color: var(--ad-primary-text);">外籍移工登入</a>
          ·
          <a href="worker-local-login.html" style="color: var(--ad-primary-text);">機耕師登入</a>
        </p>
      </div>
    </main>

    <footer class="ad-caption" style="padding: 20px 16px; text-align: center; border-top: 1px solid var(--ad-border);">
      © 2026 智農派工 AgriDispatch
    </footer>
  </div>

  <script>
    const { createApp, ref, reactive } = Vue;

    createApp({
      setup() {
        const API_BASE = window.AgriAuth ? window.AgriAuth.API_BASE : (window.location.origin.startsWith('http')
          ? `${window.location.origin}/api`
          : 'http://localhost:3000/api');
        const isDemo = window.AgriAuth ? window.AgriAuth.MODE !== 'production' : true;
        const demoCfg = (window.AGRI_DEMO_ACCOUNTS && window.AGRI_DEMO_ACCOUNTS.farmer) || null;

        const form = reactive({
          identifier: isDemo && demoCfg ? demoCfg.defaultIdentifier : '',
          password: isDemo && demoCfg ? demoCfg.defaultPassword : ''
        });
        const rememberMe = ref(true);
        const loading = ref(false);
        const errorMsg = ref('');
        const successMsg = ref('');

        const fillProfile = (identifier, password) => {
          form.identifier = identifier;
          form.password = password;
          errorMsg.value = '';
          if (window.AgriNativeBridge && typeof window.AgriNativeBridge.vibrate === 'function') {
            window.AgriNativeBridge.vibrate(50);
          }
        };

        const handleLogin = async () => {
          errorMsg.value = '';
          successMsg.value = '';
          loading.value = true;

          if (!isDemo) {
            // production 模式：一律呼叫真實登入 API，失敗顯示錯誤、不做任何離線 fallback
            try {
              const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: form.identifier, password: form.password })
              });
              const data = await res.json().catch(() => null);
              if (res.ok && data && data.success && data.user) {
                window.AgriAuth.setSession(data.token, data.user);
                sessionStorage.setItem('farmerUser', JSON.stringify(data.user));
                successMsg.value = `歡迎回來，${data.user.name}！正在為您開啟農場主工作台...`;
                setTimeout(() => { window.location.href = 'farmer.html'; }, 500);
              } else {
                errorMsg.value = (data && data.error) || '帳號或密碼錯誤';
              }
            } catch (e) {
              errorMsg.value = '無法連線到伺服器，請稍後再試';
            } finally {
              loading.value = false;
            }
            return;
          }

          // Demo 版免控管帳密，一律通行實測
          const isYilan = form.identifier && (form.identifier.includes('yilan') || form.identifier.includes('春發'));
          const defaultUser = isYilan ? {
            id: 'FARMER-002',
            name: '李春發 (春發伯)',
            role: 'FARMER',
            phone: '0921-888-999',
            farmName: '宜蘭三星青蔥專班',
            farmArea: '8.2 分地',
            token: 'demo-farmer-token-2026'
          } : {
            id: 'FARMER-001',
            name: (form.identifier && form.identifier !== 'farmer') ? form.identifier : '陳建龍 (阿龍班長)',
            role: 'FARMER',
            phone: '0912-345-678',
            farmName: '桃園八德有機蔬菜班',
            farmArea: '5.0 分地',
            token: 'demo-farmer-token-2026'
          };

          let finalUser = defaultUser;

          // 嘗試後端驗證（若後端運作則同步資料；若離線或帳密不符亦不阻擋 Demo 體驗）
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); // 後端 PBKDF2 驗證約 1~1.5 秒
            const res = await fetch(`${API_BASE}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                identifier: form.identifier || (demoCfg && demoCfg.defaultIdentifier) || 'farmer',
                password: form.password || (demoCfg && demoCfg.defaultPassword) || ''
              }),
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (res.ok) {
              const data = await res.json();
              if (data && data.success && data.user) {
                finalUser = data.user;
              }
            }
          } catch (e) {
            // Demo 離線靜默容錯，不報錯
          }

          successMsg.value = `歡迎回來，${finalUser.name}！正在為您開啟農場主工作台...`;
          sessionStorage.setItem('agri_user', JSON.stringify(finalUser));
          sessionStorage.setItem('farmerUser', JSON.stringify(finalUser));
          sessionStorage.setItem('agri_token', finalUser.token || 'demo-farmer-token-2026');

          if (window.AgriNativeBridge) {
            if (typeof window.AgriNativeBridge.showToast === 'function') {
              window.AgriNativeBridge.showToast(`歡迎回來，${finalUser.name}！`);
            }
            if (typeof window.AgriNativeBridge.vibrate === 'function') {
              window.AgriNativeBridge.vibrate(80);
            }
          }

          setTimeout(() => {
            window.location.href = 'farmer.html';
          }, 600);
        };

        const alertHelp = () => {
          (window.AgriUtil ? window.AgriUtil.toast : (t, m) => alert(`${t}\n${m}`))('忘記密碼', '請撥合作社專線 (03) 388-1234，或在 LINE 官方帳號留言。');
        };

        return {
          form,
          rememberMe,
          loading,
          errorMsg,
          successMsg,
          isDemo,
          demoCfg,
          fillProfile,
          handleLogin,
          alertHelp
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
