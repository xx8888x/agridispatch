plugins {
    id 'com.android.application'
}

// Release 簽章設定：從 keystore.properties 讀取 (該檔已列於 .gitignore，不會被提交)。
// 檔案不存在時 (例如尚未申請正式簽章金鑰)，release 建置就不設定 signingConfig，
// 僅產出未簽章的 APK，可自行以 apksigner 或 Android Studio 手動簽署。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 版本號自動遞增：version.properties 記錄最後一次 release 建置的 VERSION_CODE (此檔要提交進 git)。
// 執行任何 release 任務 (assemble/bundle/install…Release，或不指定 flavor 的 assemble、bundle、build) 時 +1 並寫回；
// debug 建置與 Android Studio 同步沿用目前值、不遞增。versionName = VERSION_NAME_BASE.VERSION_CODE (例如 1.0.2)。
// CI 可用 -PversionCode=N 指定，此時不讀寫檔案。
def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }
def releaseTaskRequested = gradle.startParameter.taskNames.any { name ->
    def task = name.substring(name.lastIndexOf(':') + 1)
    task.toLowerCase().contains('release') || task in ['assemble', 'bundle', 'build']
}
def appVersionCode = versionProps['VERSION_CODE'] as int
if (project.hasProperty('versionCode')) {
    appVersionCode = project.property('versionCode') as int
} else if (releaseTaskRequested) {
    appVersionCode += 1
    // 只替換 VERSION_CODE 那一行，保留檔案內的說明註解
    versionPropsFile.setText(versionPropsFile.getText('UTF-8')
            .replaceFirst(/(?m)^VERSION_CODE=\d+/, "VERSION_CODE=${appVersionCode}"), 'UTF-8')
    logger.lifecycle("[AgriDispatch] release 建置：versionCode 遞增為 ${appVersionCode}，請提交 version.properties")
}
def appVersionName = "${versionProps['VERSION_NAME_BASE']}.${appVersionCode}"

android {
    namespace 'com.agridispatch.app'
    // Google Play 新上架 App 自 2025/8 起要求 targetSdk 35 以上；
    // 2026 年後可能已進一步要求 36，上架前請務必以 Play Console 當下公告為準再行調整。
    compileSdk 35

    defaultConfig {
        applicationId "com.agridispatch.app"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildFeatures {
        buildConfig true
    }

    // 依「端」拆成兩支 APK (分類見 docs/角色與人力分類表.md)：
    //   server：科技後台 (科技公司代管人員)，applicationId 加 .admin，可與客戶端同機安裝
    //   client：農場主與工人 (本勞／外勞依國別)，沿用原 applicationId
    flavorDimensions = ['side']
    productFlavors {
        server {
            dimension 'side'
            applicationIdSuffix '.admin'
            versionNameSuffix '-admin'
            buildConfigField 'String', 'APP_SIDE', '"server"'
        }
        client {
            dimension 'side'
            buildConfigField 'String', 'APP_SIDE', '"client"'
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    // App 內建網頁連線的後端（WebAppInterface.getBackendConfig → assets/www/*/js/app-config.js）：
    //   API_BASE 空字串＝不連後端，沿用內建示範資料（mock）；有值＝關閉 mock、改連此後端，APP_MODE 決定網頁模式。
    //   debug：本機後端，模擬器先執行 adb reverse tcp:3000 tcp:3000；-PagriDebugApiBase= （空值）可改回示範資料
    //   release：正式網域上線前留空（維持示範資料）；上線後改為 https://agridispatch.tw/api，或建置時 -PagriApiBase=https://…
    def debugApiBase = project.findProperty('agriDebugApiBase') ?: (project.hasProperty('agriDebugApiBase') ? '' : 'http://localhost:3000/api')
    // debug 的網頁模式預設 demo；連正式模式後端（例如本機正式模式測試）時以 -PagriDebugAppMode=production 指定
    def debugAppMode = project.findProperty('agriDebugAppMode') ?: 'demo'
    def releaseApiBase = project.findProperty('agriApiBase') ?: ''
    if (releaseApiBase && !releaseApiBase.startsWith('https://')) {
        throw new GradleException("release 的後端網址必須是 https：${releaseApiBase}")
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE', "\"${debugApiBase}\""
            buildConfigField 'String', 'APP_MODE', "\"${debugAppMode}\""
        }
        release {
            buildConfigField 'String', 'API_BASE', "\"${releaseApiBase}\""
            buildConfigField 'String', 'APP_MODE', '"production"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 客戶端 APK 不打包科技後台頁面 (assets/www/科技後台/)；Server 端打包全部前端頁面
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.flavorName == 'client') {
            variant.androidResources.ignoreAssetsPatterns.add('<dir>科技後台')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Firebase Cloud Messaging (FCM) & Push Notifications
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// 僅在存在 app/google-services.json 時才套用 Firebase/FCM 設定外掛。
// 未設定 Firebase 專案時 (例如本地開發或體驗館展示用途) 略過套用，建置仍可正常成功；
// 此時 FCM 相關功能 (AgriFirebaseMessagingService) 會安全降級、不會導致 App 崩潰，
// 但無法實際收到雲端推播。請參考 app/google-services.json.example 與 README.md 設定真實金鑰檔。
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('⚠️ [AgriDispatch] 未找到 app/google-services.json，已略過套用 google-services 外掛；FCM 推播將無法運作 (App 本身仍可正常建置與執行)。')
}
