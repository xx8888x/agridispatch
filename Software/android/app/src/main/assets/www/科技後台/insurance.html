<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智農派工 AgriDispatch - 保險登錄</title>
  <!-- 執行模式設定（demo / production，每份副本各自一份） -->
  <script src="js/app-config.js"></script>
  <!-- API Client：自動帶 token、demo 自動登入、production 401 導向 -->
  <script src="js/api-client.js"></script>
  <script>
    // production 模式：無 token 或非管理員則導向登入頁（demo 模式不強制）
    if (window.AgriAuth) window.AgriAuth.requireRole(['admin_tech'], 'admin-login.html');
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' } } } }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="admin.html" class="flex items-center gap-2 shrink-0">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-400 flex items-center justify-center shadow-lg shadow-indigo-600/30">
          <span class="text-xl">🛡️</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-lg tracking-tight text-white">智農派工</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-semibold">科技後台</span>
          </div>
          <p class="hidden sm:block text-[11px] text-slate-400">合作社加退保登錄 ╳ 派工前加保檢查</p>
        </div>
      </a>
      <a href="admin.html" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition shrink-0">← 回整合管理後台</a>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <div class="space-y-2 border-b border-slate-800 pb-5">
      <h1 class="text-2xl sm:text-3xl font-black text-white flex items-center gap-2"><span>🛡️</span> 保險登錄</h1>
      <p class="text-sm text-slate-400 max-w-3xl leading-relaxed">
        記錄合作社為每位工人辦理的勞保、就保、職保、健保加退保結果（實際申報於勞保局／健保署系統辦理）。
        工班中只要有人未完整加保，訂單就無法轉為「施工中」。
      </p>
      <p class="text-[11px] text-amber-300/90">【待確認】應加保險種：本國籍為勞保／就保／職保／健保；外籍移工為勞保／職保／健保（不適用就保）。外籍配偶、部分工時投保級距等例外請洽勞保局。</p>
    </div>

    <div id="loadError" class="hidden p-4 rounded-2xl bg-rose-950/50 border border-rose-500/40 text-sm text-rose-200"></div>

    <div id="kpiRow" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

    <div>
      <h2 class="text-sm font-black text-white mb-2">工班加保概況（今日）</h2>
      <div id="teamRow" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center gap-3 p-4 rounded-2xl bg-slate-900 border border-slate-800">
      <input id="fSearch" type="search" oninput="renderTable()" placeholder="搜尋工號、姓名" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
      <select id="fFilter" onchange="renderTable()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
        <option value="all">全部工人</option>
        <option value="gap">只看未完整加保</option>
        <option value="local">本國籍</option>
        <option value="foreign">外籍</option>
      </select>
    </div>

    <div class="p-4 rounded-3xl bg-slate-900 border border-slate-800 overflow-x-auto">
      <table class="w-full text-xs min-w-[820px]">
        <thead>
          <tr class="text-left text-slate-400 border-b border-slate-800">
            <th class="py-2 pr-3">工人</th>
            <th class="py-2 pr-3">工班</th>
            <th class="py-2 pr-3">勞保</th>
            <th class="py-2 pr-3">就保</th>
            <th class="py-2 pr-3">職保</th>
            <th class="py-2 pr-3">健保</th>
            <th class="py-2 pr-3">狀態</th>
            <th class="py-2"></th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="8" class="py-8 text-center text-slate-500">載入中…</td></tr></tbody>
      </table>
    </div>
  </main>

  <!-- 工人明細 Modal：加退保歷史＋登錄加保 -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
    <div class="w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 rounded-3xl bg-slate-900 border border-indigo-500/40 space-y-5">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 id="dTitle" class="text-white font-black text-lg"></h3>
          <p id="dSub" class="text-[11px] text-slate-400"></p>
        </div>
        <button type="button" onclick="closeDetail()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div>
        <h4 class="text-xs font-black text-slate-300 mb-2">加退保歷史</h4>
        <div id="dHistory" class="space-y-2"></div>
      </div>

      <div class="p-4 rounded-2xl bg-slate-800/60 border border-slate-700/60 space-y-3">
        <h4 class="text-xs font-black text-emerald-300">＋ 登錄加保</h4>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 mb-1">險種</label>
            <select id="eType" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 mb-1">月投保薪資 (NT$)</label>
            <input id="eSalary" type="number" min="1" step="1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 mb-1">加保日</label>
            <input id="eDate" type="date" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 mb-1">申報受理編號（選填）</label>
            <input id="eRef" type="text" maxlength="40" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono">
          </div>
        </div>
        <p id="eMsg" class="hidden text-xs"></p>
        <button type="button" id="eSubmit" onclick="submitEnroll()" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm transition">登錄加保</button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-3 rounded-2xl bg-slate-800 border border-indigo-500/40 text-sm text-white shadow-2xl max-w-[90vw]"></div>

  <script>
    const TYPES = ['labor', 'employment', 'occupational', 'health'];
    const LABEL = { labor: '勞保', employment: '就保', occupational: '職保', health: '健保' };
    const MIN_WAGE = 29500;
    let workers = [];
    let current = null;

    function api(path, options) {
      const base = (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';
      return fetch(`${base}${path}`, options).then(async res => {
        const body = await res.json().catch(() => ({}));
        if (!res.ok || body.success === false) throw new Error(body.error || body.message || `HTTP ${res.status}`);
        return body;
      });
    }
    function post(path, data) {
      return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function today() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add('hidden'), 3000);
    }

    async function loadAll() {
      try {
        workers = (await api('/insurance/workers')).data;
        document.getElementById('loadError').classList.add('hidden');
      } catch (e) {
        const el = document.getElementById('loadError');
        el.textContent = `無法載入保險資料：${e.message}（請確認後端 3000 已啟動，且以管理員身分登入）`;
        el.classList.remove('hidden');
        document.getElementById('rows').innerHTML = '';
        return;
      }
      renderKpis();
      renderTable();
      loadTeams();
    }

    function renderKpis() {
      const gaps = workers.filter(w => !w.fullyInsured).length;
      const local = workers.filter(w => w.nationality === '本國').length;
      const tiles = [
        ['工人數', workers.length, 'text-white'],
        ['完整加保', workers.length - gaps, 'text-emerald-300'],
        ['未完整加保', gaps, gaps ? 'text-rose-300' : 'text-slate-400'],
        ['本國／外籍', `${local}／${workers.length - local}`, 'text-white']
      ];
      document.getElementById('kpiRow').innerHTML = tiles.map(([k, v, c]) => `
        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800">
          <div class="text-[11px] text-slate-400">${k}</div>
          <div class="mt-1 text-2xl font-black ${c}">${v}</div>
        </div>`).join('');
    }

    async function loadTeams() {
      const teamIds = [...new Set(workers.map(w => w.teamId).filter(Boolean))].sort();
      const cards = await Promise.all(teamIds.map(async id => {
        try {
          const t = (await api(`/insurance/teams/${encodeURIComponent(id)}`)).data;
          const ok = t.allInsured;
          const gapText = (t.gaps || []).map(g => `${esc(g.name)}（缺${esc(g.missing.join('、'))}）`).join('<br>');
          return `<div class="p-4 rounded-2xl border ${ok ? 'bg-emerald-950/30 border-emerald-500/30' : 'bg-rose-950/40 border-rose-500/40'}">
              <div class="text-xs font-black text-white">${esc(id)}</div>
              <div class="mt-1 text-sm font-bold ${ok ? 'text-emerald-300' : 'text-rose-300'}">${ok ? '✅ 可出工' : '⛔ 不可出工'}・${t.insured}/${t.total} 人</div>
              ${gapText ? `<div class="mt-1 text-[11px] text-rose-200">${gapText}</div>` : ''}
            </div>`;
        } catch (e) {
          return `<div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 text-xs text-slate-400">${esc(id)}：無法載入</div>`;
        }
      }));
      document.getElementById('teamRow').innerHTML = cards.join('');
    }

    function cell(w, type) {
      if (!w.required.includes(type)) return '<span class="text-slate-600">不適用</span>';
      const r = w.active[type];
      if (!r) return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/15 text-rose-300 border border-rose-500/40">未加保</span>';
      return `<div class="text-emerald-300 font-bold">✓ ${r.insuredSalary.toLocaleString()}</div><div class="text-[10px] text-slate-500">${esc(r.enrollDate)} 起</div>`;
    }

    function renderTable() {
      const q = document.getElementById('fSearch').value.trim().toLowerCase();
      const f = document.getElementById('fFilter').value;
      const list = workers.filter(w => {
        if (f === 'gap' && w.fullyInsured) return false;
        if (f === 'local' && w.nationality !== '本國') return false;
        if (f === 'foreign' && w.nationality === '本國') return false;
        return !q || w.workerId.toLowerCase().includes(q) || String(w.name).toLowerCase().includes(q);
      });
      document.getElementById('rows').innerHTML = list.length ? list.map(w => `
        <tr class="border-b border-slate-800/70">
          <td class="py-2.5 pr-3"><div class="font-bold text-white">${esc(w.name)}</div><div class="text-[10px] text-slate-500 font-mono">${esc(w.workerId)}・${esc(w.nationality)}</div></td>
          <td class="py-2.5 pr-3 text-slate-300">${esc(w.teamId || '—')}</td>
          ${TYPES.map(t => `<td class="py-2.5 pr-3">${cell(w, t)}</td>`).join('')}
          <td class="py-2.5 pr-3">${w.fullyInsured
            ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/40">完整加保</span>'
            : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/15 text-rose-300 border border-rose-500/40">缺 ${w.missing.map(t => LABEL[t]).join('、')}</span>`}</td>
          <td class="py-2.5 text-right"><button type="button" data-id="${esc(w.workerId)}" onclick="openDetail(this.dataset.id)" class="px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-200 hover:bg-indigo-500/30 border border-indigo-500/30 font-bold">管理</button></td>
        </tr>`).join('') : '<tr><td colspan="8" class="py-8 text-center text-slate-500">沒有符合的工人</td></tr>';
    }

    async function openDetail(workerId) {
      const m = document.getElementById('detailModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
      setMsg('', '');
      document.getElementById('dHistory').innerHTML = '<div class="text-xs text-slate-500">載入中…</div>';
      try {
        current = (await api(`/insurance/workers/${encodeURIComponent(workerId)}`)).data;
      } catch (e) {
        document.getElementById('dHistory').innerHTML = `<div class="text-xs text-rose-300">${esc(e.message)}</div>`;
        return;
      }
      document.getElementById('dTitle').textContent = `${current.name}（${current.workerId}）`;
      document.getElementById('dSub').textContent = `${current.nationality}・${current.teamId || '未分班'}・月薪 ${current.baseSalary ? current.baseSalary.toLocaleString() : '—'}・應加保：${current.required.map(t => LABEL[t]).join('、')}`;
      renderHistory();
      const typeSel = document.getElementById('eType');
      typeSel.innerHTML = current.required.map(t => `<option value="${t}" ${current.missing.includes(t) ? '' : 'disabled'}>${LABEL[t]}${current.missing.includes(t) ? '（未加保）' : '（已在保）'}</option>`).join('');
      const firstMissing = current.missing[0];
      if (firstMissing) typeSel.value = firstMissing;
      document.getElementById('eSalary').value = Math.max(current.baseSalary || 0, MIN_WAGE);
      document.getElementById('eDate').value = today();
      document.getElementById('eRef').value = '';
      document.getElementById('eSubmit').disabled = !firstMissing;
      document.getElementById('eSubmit').classList.toggle('opacity-50', !firstMissing);
    }

    function renderHistory() {
      const recs = current.records;
      document.getElementById('dHistory').innerHTML = recs.length ? recs.map(r => `
        <div class="flex items-center justify-between gap-3 p-3 rounded-xl ${r.active ? 'bg-emerald-950/30 border border-emerald-500/30' : 'bg-slate-800/40 border border-slate-700/50'}">
          <div class="text-xs">
            <div class="font-bold ${r.active ? 'text-emerald-300' : 'text-slate-400'}">${LABEL[r.type]}・投保薪資 ${r.insuredSalary.toLocaleString()}</div>
            <div class="text-[11px] text-slate-400">加保 ${esc(r.enrollDate)}${r.withdrawDate ? `　退保 ${esc(r.withdrawDate)}${r.withdrawReason ? `（${esc(r.withdrawReason)}）` : ''}` : '　在保中'}${r.filingRef ? `　受理編號 ${esc(r.filingRef)}` : ''}</div>
          </div>
          ${r.withdrawDate ? '' : `
          <div class="flex items-center gap-1 shrink-0">
            <input type="date" data-withdraw-for="${esc(r.id)}" value="${today()}" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-[11px] text-white">
            <button type="button" data-id="${esc(r.id)}" onclick="submitWithdraw(this.dataset.id)" class="px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-200 hover:bg-rose-500/30 border border-rose-500/30 text-[11px] font-bold">退保</button>
          </div>`}
        </div>`).join('') : '<div class="text-xs text-slate-500">尚無加退保紀錄</div>';
    }

    function closeDetail() {
      const m = document.getElementById('detailModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function setMsg(text, kind) {
      const el = document.getElementById('eMsg');
      el.innerHTML = text;
      el.className = text ? `text-xs ${kind === 'error' ? 'text-rose-300' : kind === 'warn' ? 'text-amber-300' : 'text-emerald-300'}` : 'hidden text-xs';
    }

    async function submitEnroll() {
      const btn = document.getElementById('eSubmit');
      btn.disabled = true;
      try {
        const res = await post(`/insurance/workers/${encodeURIComponent(current.workerId)}/enroll`, {
          type: document.getElementById('eType').value,
          insuredSalary: parseInt(document.getElementById('eSalary').value, 10),
          enrollDate: document.getElementById('eDate').value,
          filingRef: document.getElementById('eRef').value.trim()
        });
        const id = current.workerId;
        await loadAll();
        await openDetail(id);
        if (res.warnings && res.warnings.length) {
          setMsg('✓ 已登錄加保。注意：<br>' + res.warnings.map(esc).join('<br>'), 'warn');
        } else {
          setMsg('✓ 已登錄加保', 'ok');
        }
      } catch (e) {
        setMsg(esc(e.message), 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function submitWithdraw(recordId) {
      const date = [...document.querySelectorAll('[data-withdraw-for]')].find(el => el.dataset.withdrawFor === recordId).value;
      if (!confirm(`確定登錄退保？退保日 ${date} 起不再承保，所屬工班將無法出工直到補登加保。`)) return;
      try {
        await post(`/insurance/records/${encodeURIComponent(recordId)}/withdraw`, { withdrawDate: date, reason: '後台登錄退保' });
        const id = current.workerId;
        await loadAll();
        await openDetail(id);
        toast('已登錄退保');
      } catch (e) {
        setMsg(esc(e.message), 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadAll);
  </script>
</body>
</html>
