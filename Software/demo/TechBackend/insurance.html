<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智農派工 AgriDispatch - 保險登錄</title>
  <!-- 執行模式設定（demo / production，每份副本各自一份） -->
  <script src="js/app-config.js"></script>
  <!-- API Client：自動帶 token、demo 自動登入、production 401 導向 -->
  <script src="js/api-client.js"></script>
  <script>
    // production 模式：無 token 或非管理員則導向登入頁（demo 模式不強制）
    if (window.AgriAuth) window.AgriAuth.requireRole(['admin_tech'], 'admin-login.html');
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記、圖示、抽屜 -->
  <script src="js/agri-theme.js"></script>
  <!-- Lucide 圖示：本機 vendor 優先，CDN 備援 -->
  <script src="js/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@1.47.0"><\/script>');
    }
  </script>
  <link rel="stylesheet" href="css/agri.css">
</head>
<body class="ad-body ad-has-tabbar min-h-screen flex flex-col">

  <header class="ad-header">
    <div class="ad-container ad-header__inner" style="max-width: 1280px;">
      <a href="admin.html" class="ad-header__brand">
        <span class="ad-header__logo"><i data-lucide="sprout" class="ad-icon"></i></span>
        智農派工
        <span class="ad-header__role">營運後台</span>
      </a>
      <nav class="ad-nav" aria-label="營運工具">
        <a class="ad-nav__link is-active" href="insurance.html">保險登錄</a>
        <a class="ad-nav__link" href="skills.html">技能複核</a>
        <a class="ad-nav__link" href="matching.html">派工媒合</a>
        <a class="ad-nav__link" href="rosters.html">共享班表</a>
        <a class="ad-nav__link" href="leaves.html">請假審核</a>
        <a class="ad-nav__link" href="payroll.html">出勤結算</a>
      </nav>
      <div class="ad-header__actions">
        <button type="button" class="ad-btn ad-btn--ghost ad-btn--sm" data-demo-only onclick="demoNav.open()" aria-label="示範導覽"><i data-lucide="layout-grid" class="ad-icon ad-icon--sm"></i><span class="ad-hide-sm">示範導覽</span></button>
        <a href="admin.html" class="ad-btn ad-btn--secondary ad-btn--sm"><i data-lucide="arrow-left" class="ad-icon ad-icon--sm"></i>回後台</a>
      </div>
    </div>
  </header>

  <nav class="ad-tabbar" aria-label="營運工具">
    <a class="ad-tabbar__item is-active" href="insurance.html"><i data-lucide="shield-check" class="ad-icon"></i>保險登錄</a>
    <a class="ad-tabbar__item" href="skills.html"><i data-lucide="award" class="ad-icon"></i>技能複核</a>
    <a class="ad-tabbar__item" href="matching.html"><i data-lucide="route" class="ad-icon"></i>派工媒合</a>
    <a class="ad-tabbar__item" href="admin.html"><i data-lucide="layout-dashboard" class="ad-icon"></i>後台</a>
  </nav>

  <main class="flex-1 ad-container w-full" style="max-width: 1280px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 20px;">
    <div style="min-width: 0;">
      <h1 class="ad-display">保險登錄</h1>
      <p class="ad-caption" style="margin-top: 6px; max-width: 820px;">記錄合作社為每位工人辦理的勞保、就保、職保、健保加退保結果（實際申報於勞保局／健保署系統辦理）。工班中只要有人未完整加保，訂單就無法轉為「施工中」。</p>
      <p class="ad-caption" style="margin-top: 6px; color: var(--ad-accent-text); max-width: 820px;">【待確認】應加保險種：本國籍為勞保／就保／職保／健保；外籍移工為勞保／職保／健保（不適用就保）。外籍配偶、部分工時投保級距等例外請洽勞保局。</p>
    </div>
    <div id="loadError" class="ad-notice ad-notice--danger" role="alert" hidden></div>

    <div id="kpiRow" class="ad-stat-grid"></div>

    <section>
      <h2 class="ad-title" style="margin-bottom: 10px;">工班加保概況（今日）</h2>
      <div id="teamRow" class="ad-stat-grid"></div>
    </section>

    <div class="ad-card" style="display: flex; flex-wrap: wrap; gap: 12px; padding: 14px;">
      <input id="fSearch" type="search" oninput="renderTable()" placeholder="搜尋工號、姓名" aria-label="搜尋工號、姓名" class="ad-input" style="flex: 1; min-width: 180px;">
      <select id="fFilter" onchange="renderTable()" aria-label="篩選" class="ad-select" style="width: auto; min-width: 150px;">
        <option value="all">全部工人</option>
        <option value="gap">只看未完整加保</option>
        <option value="local">本國籍</option>
        <option value="foreign">外籍</option>
      </select>
    </div>

    <div class="ad-card" style="padding: 8px 16px; overflow-x: auto;">
      <table class="ad-table" style="min-width: 820px;">
        <thead>
          <tr>
            <th>工人</th><th>工班</th><th>勞保</th><th>就保</th><th>職保</th><th>健保</th><th>狀態</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="8" style="text-align: center; padding: 32px 12px; color: var(--ad-text-3);">載入中…</td></tr></tbody>
      </table>
    </div>
  </main>

  <!-- 工人明細：加退保歷史＋登錄加保 -->
  <div id="detailModal" class="ad-modal" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
    <div class="ad-modal__panel" style="max-width: 640px;">
      <div class="ad-card__head">
        <div style="min-width: 0;">
          <h3 id="dTitle" class="ad-title"></h3>
          <p id="dSub" class="ad-caption"></p>
        </div>
        <button type="button" onclick="closeDetail()" class="ad-btn ad-btn--ghost ad-btn--icon ad-btn--sm" aria-label="關閉"><i data-lucide="x" class="ad-icon"></i></button>
      </div>

      <section>
        <h4 class="ad-heading" style="margin-bottom: 8px;">加退保歷史</h4>
        <div id="dHistory" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </section>

      <section class="ad-card ad-card--inset" style="display: flex; flex-direction: column; gap: 12px;">
        <h4 class="ad-heading">登錄加保</h4>
        <div class="ad-form-grid ad-form-grid--2">
          <div class="ad-field"><label class="ad-label" for="eType">險種</label><select id="eType" class="ad-select"></select></div>
          <div class="ad-field"><label class="ad-label" for="eSalary">月投保薪資 (NT$)</label><input id="eSalary" type="number" inputmode="numeric" min="1" step="1" class="ad-input ad-num"></div>
          <div class="ad-field"><label class="ad-label" for="eDate">加保日</label><input id="eDate" type="date" class="ad-input"></div>
          <div class="ad-field"><label class="ad-label" for="eRef">申報受理編號（選填）</label><input id="eRef" type="text" maxlength="40" class="ad-input ad-num"></div>
        </div>
        <p id="eMsg" hidden></p>
        <button type="button" id="eSubmit" onclick="submitEnroll()" class="ad-btn ad-btn--primary ad-btn--block">登錄加保</button>
      </section>
    </div>
  </div>

  <div id="toast" class="ad-toast" role="status" hidden></div>

  <script>
    const TYPES = ['labor', 'employment', 'occupational', 'health'];
    const LABEL = { labor: '勞保', employment: '就保', occupational: '職保', health: '健保' };
    const MIN_WAGE = 29500;
    let workers = [];
    let current = null;

    function api(path, options) {
      const base = (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';
      return fetch(`${base}${path}`, options).then(async res => {
        const body = await res.json().catch(() => ({}));
        if (!res.ok || body.success === false) throw new Error(body.error || body.message || `HTTP ${res.status}`);
        return body;
      });
    }
    function post(path, data) {
      return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function today() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.hidden = true; }, 3000);
    }

    async function loadAll() {
      try {
        workers = (await api('/insurance/workers')).data;
        document.getElementById('loadError').hidden = true;
      } catch (e) {
        const el = document.getElementById('loadError');
        el.textContent = `無法載入保險資料：${e.message}（請確認後端 3000 已啟動，且以管理員身分登入）`;
        el.hidden = false;
        document.getElementById('rows').innerHTML = '';
        return;
      }
      renderKpis();
      renderTable();
      loadTeams();
    }

    function renderKpis() {
      const gaps = workers.filter(w => !w.fullyInsured).length;
      const local = workers.filter(w => w.nationality === '本國').length;
      const tiles = [
        ['工人數', workers.length, ''],
        ['完整加保', workers.length - gaps, 'ad-stat--primary'],
        ['未完整加保', gaps, gaps ? 'ad-stat--danger' : ''],
        ['本國／外籍', `${local}／${workers.length - local}`, '']
      ];
      document.getElementById('kpiRow').innerHTML = tiles.map(([k, v, c]) => `
        <div class="ad-stat ${c}">
          <div class="ad-stat__label">${k}</div>
          <div class="ad-stat__value">${v}</div>
        </div>`).join('');
    }

    async function loadTeams() {
      const teamIds = [...new Set(workers.map(w => w.teamId).filter(Boolean))].sort();
      const cards = await Promise.all(teamIds.map(async id => {
        try {
          const t = (await api(`/insurance/teams/${encodeURIComponent(id)}`)).data;
          const ok = t.allInsured;
          const gapText = (t.gaps || []).map(g => `${esc(g.name)}（缺${esc(g.missing.join('、'))}）`).join('<br>');
          return `<div class="ad-stat ${ok ? 'ad-stat--primary' : 'ad-stat--danger'}">
              <div class="ad-stat__label">${esc(id)}</div>
              <div class="ad-heading" style="color: ${ok ? 'var(--ad-primary-text)' : 'var(--ad-danger-text)'};">${ok ? '可出工' : '不可出工'}・${t.insured}/${t.total} 人</div>
              ${gapText ? `<div class="ad-caption" style="margin-top: 4px; color: var(--ad-danger-text);">${gapText}</div>` : ''}
            </div>`;
        } catch (e) {
          return `<div class="ad-stat"><div class="ad-stat__label">${esc(id)}</div><div class="ad-caption">無法載入</div></div>`;
        }
      }));
      document.getElementById('teamRow').innerHTML = cards.join('');
    }

    function cell(w, type) {
      if (!w.required.includes(type)) return '<span class="ad-caption" style="color: var(--ad-text-3);">不適用</span>';
      const r = w.active[type];
      if (!r) return '<span class="ad-pill ad-pill--danger">未加保</span>';
      return `<div class="ad-num" style="color: var(--ad-primary-text); font-weight: 600;">${r.insuredSalary.toLocaleString()}</div><div class="ad-caption ad-num">${esc(r.enrollDate)} 起</div>`;
    }

    function renderTable() {
      const q = document.getElementById('fSearch').value.trim().toLowerCase();
      const f = document.getElementById('fFilter').value;
      const list = workers.filter(w => {
        if (f === 'gap' && w.fullyInsured) return false;
        if (f === 'local' && w.nationality !== '本國') return false;
        if (f === 'foreign' && w.nationality === '本國') return false;
        return !q || w.workerId.toLowerCase().includes(q) || String(w.name).toLowerCase().includes(q);
      });
      document.getElementById('rows').innerHTML = list.length ? list.map(w => `
        <tr>
          <td><div style="font-weight: 600;">${esc(w.name)}</div><div class="ad-caption ad-num">${esc(w.workerId)}・${esc(w.nationality)}</div></td>
          <td>${esc(w.teamId || '—')}</td>
          ${TYPES.map(t => `<td>${cell(w, t)}</td>`).join('')}
          <td>${w.fullyInsured
            ? '<span class="ad-pill ad-pill--ok">完整加保</span>'
            : `<span class="ad-pill ad-pill--danger">缺 ${w.missing.map(t => LABEL[t]).join('、')}</span>`}</td>
          <td style="text-align: right;"><button type="button" data-id="${esc(w.workerId)}" onclick="openDetail(this.dataset.id)" class="ad-btn ad-btn--secondary ad-btn--sm">管理</button></td>
        </tr>`).join('') : '<tr><td colspan="8" style="text-align: center; padding: 32px 12px; color: var(--ad-text-3);">沒有符合的工人</td></tr>';
    }

    async function openDetail(workerId) {
      document.getElementById('detailModal').hidden = false;
      setMsg('', '');
      document.getElementById('dHistory').innerHTML = '<div class="ad-caption">載入中…</div>';
      try {
        current = (await api(`/insurance/workers/${encodeURIComponent(workerId)}`)).data;
      } catch (e) {
        document.getElementById('dHistory').innerHTML = `<div class="ad-notice ad-notice--danger" role="alert">${esc(e.message)}</div>`;
        return;
      }
      document.getElementById('dTitle').textContent = `${current.name}（${current.workerId}）`;
      document.getElementById('dSub').textContent = `${current.nationality}・${current.teamId || '未分班'}・月薪 ${current.baseSalary ? current.baseSalary.toLocaleString() : '—'}・應加保：${current.required.map(t => LABEL[t]).join('、')}`;
      renderHistory();
      const typeSel = document.getElementById('eType');
      typeSel.innerHTML = current.required.map(t => `<option value="${t}" ${current.missing.includes(t) ? '' : 'disabled'}>${LABEL[t]}${current.missing.includes(t) ? '（未加保）' : '（已在保）'}</option>`).join('');
      const firstMissing = current.missing[0];
      if (firstMissing) typeSel.value = firstMissing;
      document.getElementById('eSalary').value = Math.max(current.baseSalary || 0, MIN_WAGE);
      document.getElementById('eDate').value = today();
      document.getElementById('eRef').value = '';
      document.getElementById('eSubmit').disabled = !firstMissing;
    }

    function renderHistory() {
      const recs = current.records;
      document.getElementById('dHistory').innerHTML = recs.length ? recs.map(r => `
        <div class="ad-card ad-card--inset" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px; ${r.active ? 'border-color: var(--ad-primary);' : ''}">
          <div>
            <div class="ad-heading" style="font-size: 14px; ${r.active ? 'color: var(--ad-primary-text);' : 'color: var(--ad-text-3);'}">${LABEL[r.type]}・投保薪資 <span class="ad-num">${r.insuredSalary.toLocaleString()}</span></div>
            <div class="ad-caption">加保 ${esc(r.enrollDate)}${r.withdrawDate ? `　退保 ${esc(r.withdrawDate)}${r.withdrawReason ? `（${esc(r.withdrawReason)}）` : ''}` : '　在保中'}${r.filingRef ? `　受理編號 ${esc(r.filingRef)}` : ''}</div>
          </div>
          ${r.withdrawDate ? '' : `
          <div style="display: flex; align-items: center; gap: 6px;">
            <input type="date" data-withdraw-for="${esc(r.id)}" value="${today()}" aria-label="退保日" class="ad-input" style="height: 36px; width: auto;">
            <button type="button" data-id="${esc(r.id)}" onclick="submitWithdraw(this.dataset.id)" class="ad-btn ad-btn--danger ad-btn--sm">退保</button>
          </div>`}
        </div>`).join('') : '<div class="ad-caption">尚無加退保紀錄</div>';
    }

    function closeDetail() {
      document.getElementById('detailModal').hidden = true;
    }

    function setMsg(text, kind) {
      const el = document.getElementById('eMsg');
      el.innerHTML = text;
      el.hidden = !text;
      el.className = text ? `ad-notice ${kind === 'error' ? 'ad-notice--danger' : kind === 'warn' ? 'ad-notice--warn' : 'ad-notice--ok'}` : '';
    }

    async function submitEnroll() {
      const btn = document.getElementById('eSubmit');
      btn.disabled = true;
      try {
        const res = await post(`/insurance/workers/${encodeURIComponent(current.workerId)}/enroll`, {
          type: document.getElementById('eType').value,
          insuredSalary: parseInt(document.getElementById('eSalary').value, 10),
          enrollDate: document.getElementById('eDate').value,
          filingRef: document.getElementById('eRef').value.trim()
        });
        const id = current.workerId;
        await loadAll();
        await openDetail(id);
        if (res.warnings && res.warnings.length) {
          setMsg('已登錄加保。注意：<br>' + res.warnings.map(esc).join('<br>'), 'warn');
        } else {
          setMsg('已登錄加保', 'ok');
        }
      } catch (e) {
        setMsg(esc(e.message), 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function submitWithdraw(recordId) {
      const date = [...document.querySelectorAll('[data-withdraw-for]')].find(el => el.dataset.withdrawFor === recordId).value;
      if (!confirm(`確定登錄退保？退保日 ${date} 起不再承保，所屬工班將無法出工直到補登加保。`)) return;
      try {
        await post(`/insurance/records/${encodeURIComponent(recordId)}/withdraw`, { withdrawDate: date, reason: '後台登錄退保' });
        const id = current.workerId;
        await loadAll();
        await openDetail(id);
        toast('已登錄退保');
      } catch (e) {
        setMsg(esc(e.message), 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadAll);
  </script>

  <script>
    var demoNav = AgriTheme.demoNav();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
