server:
  port: 3002

spring:
  application:
    name: agridispatch-backend-linebot
  datasource:
    url: jdbc:h2:file:../data/agridispatch_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      # 預設關閉；demo 模式（application-demo.yml）才開啟且僅限本機
      enabled: false

# =====================================================================
# 智農派工設定（詳見 Software/Doc/03_認證與API安全規格.md）
# 機密值一律由環境變數提供，勿寫入版本庫
# =====================================================================
agri:
  demo:
    enabled: false
  security:
    token-secret: ${AGRI_TOKEN_SECRET:}
    admin-password: ${AGRI_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${AGRI_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5000,http://127.0.0.1:3000}
  payment:
    provider: ${AGRI_PAYMENT_PROVIDER:mock}
    ecpay:
      merchant-id: ${ECPAY_MERCHANT_ID:}
      hash-key: ${ECPAY_HASH_KEY:}
      hash-iv: ${ECPAY_HASH_IV:}
      action-url: ${ECPAY_ACTION_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
      return-url: ${ECPAY_RETURN_URL:}
      client-back-url: ${ECPAY_CLIENT_BACK_URL:}
  line:
    channel-secret: ${LINE_CHANNEL_SECRET:}
    channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}


