<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智農派工 AgriDispatch - 選擇身分登入</title>
  <!-- 執行模式設定（demo / production，每份副本各自一份） -->
  <script src="js/app-config.js"></script>
  <!-- API Client：自動帶 token、demo 自動登入、production 401 導向 -->
  <script src="js/api-client.js"></script>
  <script>
    if (window.AGRI_CONFIG && window.AGRI_CONFIG.mode !== 'production') {
      document.write('<script src="js/demo-accounts.js"><\/script>');
    }
  </script>
  <!-- Tailwind CSS：本機 vendor 優先，CDN 備援 -->
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記、圖示、抽屜 -->
  <script src="js/agri-theme.js"></script>
  <!-- Lucide 圖示：本機 vendor 優先，CDN 備援 -->
  <script src="js/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@1.47.0"><\/script>');
    }
  </script>
  <link rel="stylesheet" href="css/agri.css">
  <style>
    .role-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
    .role { display: flex; flex-direction: column; gap: 10px; padding: 20px; }
    .role__cta { margin-top: auto; padding-top: 6px; color: var(--ad-primary-text); font-weight: 600; font-size: var(--ad-fs-caption); }
  </style>
</head>
<body class="ad-body flex flex-col min-h-screen">

  <header class="ad-header">
    <div class="ad-container ad-header__inner">
      <a href="index.html" class="ad-header__brand"><span class="ad-header__logo"><i data-lucide="sprout" class="ad-icon"></i></span>智農派工</a>
      <div class="ad-header__actions">
        <span id="serverStatusBadge" class="ad-pill"><span class="ad-pill__dot"></span>檢查連線中</span>
        <button type="button" class="ad-btn ad-btn--ghost ad-btn--sm" data-demo-only onclick="demoNav.open()" aria-label="示範導覽"><i data-lucide="layout-grid" class="ad-icon ad-icon--sm"></i><span class="ad-hide-sm">示範導覽</span></button>
        <a href="index.html" class="ad-btn ad-btn--ghost ad-btn--sm">回首頁</a>
      </div>
    </div>
  </header>

  <main class="ad-auth">
    <div class="ad-auth__card ad-auth__card--wide" style="padding: 0;">
      <div style="text-align: center; margin-bottom: 28px;">
        <h1 class="ad-display">你是哪一種身分？</h1>
        <p class="ad-text-2" style="margin-top: 8px;">選一個，登入你的工作台。</p>
      </div>

      <div class="role-grid">
        <a href="farmer-login.html" class="ad-card ad-card--interactive role">
          <span class="ad-icon-box"><i data-lucide="tractor" class="ad-icon"></i></span>
          <h2 class="ad-title">農場主／班長</h2>
          <p class="ad-caption">預約派工、看訂單與帳務。</p>
          <span class="role__cta">登入</span>
        </a>

        <a href="worker-foreign-login.html" class="ad-card ad-card--interactive role">
          <span class="ad-icon-box"><i data-lucide="users" class="ad-icon"></i></span>
          <h2 class="ad-title">外籍外展農工</h2>
          <p class="ad-caption">越／印／泰／菲語。用居留證（ARC）或護照號碼登入。</p>
          <span class="role__cta">登入</span>
        </a>

        <a href="worker-local-login.html" class="ad-card ad-card--interactive role">
          <span class="ad-icon-box"><i data-lucide="hard-hat" class="ad-icon"></i></span>
          <h2 class="ad-title">帶隊領班／機耕師</h2>
          <p class="ad-caption">帶隊點名簽核、機耕與無人機代耕接單。</p>
          <span class="role__cta">登入</span>
        </a>

        <a href="worker-local-login.html?role=labor" onclick="sessionStorage.setItem('localRole','labor');return true;" class="ad-card ad-card--interactive role">
          <span class="ad-icon-box"><i data-lucide="sprout" class="ad-icon"></i></span>
          <h2 class="ad-title">合作社勞務員</h2>
          <p class="ad-caption">看今日任務、打卡、薪資明細。</p>
          <span class="role__cta">登入</span>
        </a>

        <a href="../科技後台/admin-login.html" class="ad-card ad-card--interactive role">
          <span class="ad-icon-box ad-icon-box--neutral"><i data-lucide="layout-dashboard" class="ad-icon"></i></span>
          <h2 class="ad-title">營運管理後台</h2>
          <p class="ad-caption">科技代管與合作社調度人員。</p>
          <span class="role__cta">登入</span>
        </a>
      </div>

      <div data-demo-only style="margin-top: 24px;">
        <div class="ad-notice ad-notice--ok">每個入口都有「示範帳號」，點一下就能填入，免記帳密。</div>
      </div>
    </div>
  </main>

  <footer class="ad-caption" style="border-top: 1px solid var(--ad-border); padding: 16px; text-align: center;">
    © 2026 智農派工 AgriDispatch
  </footer>

  <script>
    var demoNav = AgriTheme.demoNav();

    // 後端連線狀態（只顯示一個小標籤）
    (async function () {
      const el = document.getElementById('serverStatusBadge');
      const base = (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';
      const isProd = window.AGRI_CONFIG && window.AGRI_CONFIG.mode === 'production';
      const set = (cls, text) => { el.className = 'ad-pill ' + cls; el.innerHTML = '<span class="ad-pill__dot"></span>' + text; };
      try {
        const res = await fetch(base + '/crops', { signal: AbortSignal.timeout(2500) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        set('ad-pill--ok', '伺服器已連線');
      } catch (e) {
        set('ad-pill--warn', isProd ? '伺服器連線中斷' : '離線，顯示示範資料');
      }
    })();
  </script>
</body>
</html>
