<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智農派工 AgriDispatch - 合法用工證明查驗</title>
  <script src="js/app-config.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記、圖示 -->
  <script src="js/agri-theme.js"></script>
  <!-- Lucide 圖示：本機 vendor 優先，CDN 備援（只用在 Vue 區塊外） -->
  <script src="js/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@1.47.0"><\/script>');
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/agri.css">
</head>
<body class="ad-body min-h-screen flex flex-col">

  <!-- 表頭：一條 56px。公開頁，無身分切換。 -->
  <header class="ad-header">
    <div class="ad-container ad-header__inner">
      <a href="index.html" class="ad-header__brand">
        <span class="ad-header__logo"><i data-lucide="sprout" class="ad-icon"></i></span>
        智農派工
        <span class="ad-header__role">證明查驗</span>
      </a>
      <div class="ad-header__actions">
      </div>
    </div>
  </header>

  <main class="flex-1 ad-container w-full" style="padding-block: 32px 40px;">
    <div style="max-width: 440px; margin-inline: auto;">
      <h1 class="ad-display">查驗用工證明</h1>
      <p class="ad-caption" style="margin-top: 6px;">輸入證明編號與查驗碼，確認證明是否有效。</p>

      <form onsubmit="event.preventDefault(); check();" class="ad-card" style="padding: 24px; margin-top: 24px; display: flex; flex-direction: column; gap: 16px;">
        <div class="ad-field">
          <label for="no" class="ad-label">證明編號</label>
          <input id="no" type="text" required placeholder="LEC-ORD-2026-013" class="ad-input ad-num" style="text-transform: uppercase;">
        </div>
        <div class="ad-field">
          <label for="code" class="ad-label">查驗碼</label>
          <input id="code" type="text" required maxlength="12" class="ad-input ad-num" style="text-transform: uppercase; letter-spacing: 0.1em;">
          <span class="ad-hint">共 12 碼，在證明書上</span>
        </div>
        <button type="submit" class="ad-btn ad-btn--primary ad-btn--lg ad-btn--block">開始查驗</button>
      </form>

      <div id="result" style="margin-top: 16px;"></div>

      <p class="ad-caption" style="margin-top: 20px; text-align: center;">只顯示證明摘要，不顯示工人個資。證明更新後，舊查驗碼即失效。</p>
    </div>
  </main>

  <footer class="ad-caption" style="padding: 20px 16px; text-align: center; border-top: 1px solid var(--ad-border);">
    © 2026 智農派工 AgriDispatch
  </footer>

  <script>
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function check() {
      const no = document.getElementById('no').value.trim().toUpperCase();
      const code = document.getElementById('code').value.trim().toUpperCase();
      const box = document.getElementById('result');
      box.innerHTML = '<p class="ad-caption" style="text-align: center;">查驗中…</p>';
      const base = (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';
      try {
        const res = await fetch(`${base}/public/certificates/${encodeURIComponent(no)}?code=${encodeURIComponent(code)}`);
        const body = await res.json();
        if (!res.ok || body.success === false) throw new Error(body.error || `HTTP ${res.status}`);
        const d = body.data;
        box.innerHTML = d.valid ? `
          <div class="ad-card" style="border-color: var(--ad-primary);">
            <div class="ad-card__head"><h2 class="ad-title">證明有效</h2><span class="ad-pill ad-pill--ok">已驗證</span></div>
            <dl style="display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 12px 0 0;">
              <dt class="ad-caption">證明編號</dt><dd class="ad-num" style="margin: 0;">${esc(d.certificateNo)}</dd>
              <dt class="ad-caption">開立單位</dt><dd style="margin: 0;">${esc(d.issuer)}</dd>
              <dt class="ad-caption">用工單位</dt><dd style="margin: 0;">${esc(d.farmerName)}</dd>
              <dt class="ad-caption">作物／項目</dt><dd style="margin: 0;">${esc(d.cropName)}，${esc(d.categoryName)}</dd>
              <dt class="ad-caption">出勤期間</dt><dd class="ad-num" style="margin: 0;">${esc(d.periodStart)} 至 ${esc(d.periodEnd)}</dd>
              <dt class="ad-caption">人數／工時</dt><dd class="ad-num" style="margin: 0;">${esc(d.workerCount)} 人／${esc(d.totalHours)} 小時</dd>
            </dl>
          </div>` : `
          <div class="ad-notice ad-notice--danger" role="alert">
            <div><div style="font-weight: 600;">查驗未通過</div><div>${esc(d.reason || '查驗碼不符')}</div></div>
          </div>`;
      } catch (e) {
        box.innerHTML = `<div class="ad-notice ad-notice--danger" role="alert">暫時無法查驗，請稍後再試（${esc(e.message)}）</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(location.search);
      if (p.get('no')) document.getElementById('no').value = p.get('no');
      if (p.get('code')) document.getElementById('code').value = p.get('code');
      if (p.get('no') && p.get('code')) check();
    });
  </script>
</body>
</html>
