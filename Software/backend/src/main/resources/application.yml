server:
  port: 3000

spring:
  application:
    name: agridispatch-backend
  datasource:
    url: jdbc:h2:file:./data/agridispatch_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      # 預設關閉；demo 模式（application-demo.yml）才開啟且僅限本機
      enabled: false

# =====================================================================
# 智農派工設定（詳見 Software/Doc/03_認證與API安全規格.md）
# 機密值一律由環境變數提供，勿寫入版本庫
# =====================================================================
agri:
  demo:
    enabled: false
  security:
    token-secret: ${AGRI_TOKEN_SECRET:}
    admin-password: ${AGRI_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${AGRI_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5000,http://127.0.0.1:3000,https://appassets.androidplatform.net}
  payment:
    provider: ${AGRI_PAYMENT_PROVIDER:mock}
    ecpay:
      merchant-id: ${ECPAY_MERCHANT_ID:}
      hash-key: ${ECPAY_HASH_KEY:}
      hash-iv: ${ECPAY_HASH_IV:}
      action-url: ${ECPAY_ACTION_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
      return-url: ${ECPAY_RETURN_URL:}
      client-back-url: ${ECPAY_CLIENT_BACK_URL:}
  line:
    channel-secret: ${LINE_CHANNEL_SECRET:}
    channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
    # LIFF 帳號綁定：LINE Login channel ID（驗證 ID token 的 aud）；未設定時綁定 API 回 503（demo 模式可用 mock:<userId> 測試）
    login-channel-id: ${LINE_LOGIN_CHANNEL_ID:}
    # 主動推播（規格 05 第柒章）：工作者帳號只在此時段推播【待確認：可推播時段與工時認定】；明日出工通知排程【待確認：時間】
    notify:
      worker-hours: ${AGRI_LINE_WORKER_HOURS:07:00-20:00}
      tomorrow-cron: ${AGRI_LINE_TOMORROW_CRON:0 0 18 * * *}
  # LINE Bot（Software/Line Bot，port 5000）內部端點：共用金鑰未設定時 /api/line/internal/** 一律 403
  linebot:
    internal-key: ${AGRI_LINEBOT_INTERNAL_KEY:}
    base-url: ${AGRI_LINEBOT_BASE_URL:http://localhost:5000}
