<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智農派工 AgriDispatch - 合法用工證明查驗</title>
  <script src="js/app-config.js"></script>
  <script src="js/api-client.js"></script>
  <link rel="stylesheet" href="css/agri.css">
</head>
<body class="ad-body" style="min-height: 100vh; display: flex; flex-direction: column;">
  <main class="ad-container" style="flex: 1; width: 100%; max-width: 520px; padding-block: 48px; display: flex; flex-direction: column; gap: 24px;">
    <div style="text-align: center;">
      <h1 class="ad-display">合法用工證明查驗</h1>
      <p class="ad-text-2" style="margin-top: 8px;">輸入證明書上的證明編號與查驗碼，確認證明為平台產製且內容未遭竄改。</p>
    </div>

    <form onsubmit="event.preventDefault(); check();" class="ad-card" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="ad-field">
        <label for="no" class="ad-label">證明編號</label>
        <input id="no" type="text" required placeholder="LEC-ORD-2026-013" autocomplete="off" class="ad-input ad-num" style="text-transform: uppercase;">
      </div>
      <div class="ad-field">
        <label for="code" class="ad-label">查驗碼（12 碼）</label>
        <input id="code" type="text" required maxlength="12" autocomplete="off" class="ad-input ad-num" style="text-transform: uppercase; letter-spacing: 0.1em;">
      </div>
      <button type="submit" class="ad-btn ad-btn--primary ad-btn--lg ad-btn--block">查驗</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="ad-caption" style="text-align: center;">查驗結果只顯示證明摘要，不顯示工人個人資料。證明內容更新後舊查驗碼即失效。</p>
  </main>

  <script>
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function check() {
      const no = document.getElementById('no').value.trim().toUpperCase();
      const code = document.getElementById('code').value.trim().toUpperCase();
      const box = document.getElementById('result');
      box.innerHTML = '<p class="ad-caption" style="text-align: center;">查驗中…</p>';
      const base = (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';
      try {
        const res = await fetch(`${base}/public/certificates/${encodeURIComponent(no)}?code=${encodeURIComponent(code)}`);
        const body = await res.json();
        if (!res.ok || body.success === false) throw new Error(body.error || `HTTP ${res.status}`);
        const d = body.data;
        box.innerHTML = d.valid ? `
          <div class="ad-card ad-card--accent" style="border-color: var(--ad-primary);">
            <div class="ad-card__head"><h2 class="ad-title" style="color: var(--ad-primary-text);">證明有效</h2><span class="ad-pill ad-pill--ok">查驗通過</span></div>
            <dl style="display: grid; grid-template-columns: 7em 1fr; gap: 8px 12px; margin: 0;">
              <dt class="ad-caption">證明編號</dt><dd class="ad-num" style="margin: 0;">${esc(d.certificateNo)}</dd>
              <dt class="ad-caption">開立單位</dt><dd style="margin: 0;">${esc(d.issuer)}</dd>
              <dt class="ad-caption">用工單位</dt><dd style="margin: 0;">${esc(d.farmerName)}</dd>
              <dt class="ad-caption">作物／項目</dt><dd style="margin: 0;">${esc(d.cropName)}・${esc(d.categoryName)}</dd>
              <dt class="ad-caption">出勤期間</dt><dd class="ad-num" style="margin: 0;">${esc(d.periodStart)} 至 ${esc(d.periodEnd)}</dd>
              <dt class="ad-caption">人數／工時</dt><dd class="ad-num" style="margin: 0;">${esc(d.workerCount)} 人／${esc(d.totalHours)} 小時</dd>
            </dl>
          </div>` : `
          <div class="ad-notice ad-notice--danger" role="alert" style="flex-direction: column; gap: 4px;">
            <strong>查驗未通過</strong>
            <span>${esc(d.reason || '查驗碼不符')}</span>
          </div>`;
      } catch (e) {
        // 連不上（網路錯誤、回傳不是 JSON）與「查無此證明」要分開；技術訊息不給使用者看
        const network = (e instanceof TypeError) || (e instanceof SyntaxError);
        box.innerHTML = `<div class="ad-notice ad-notice--danger" role="alert">${network ? '無法連線查驗服務，請稍後再試。' : '查驗失敗：' + esc(e.message)}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(location.search);
      if (p.get('no')) document.getElementById('no').value = p.get('no');
      if (p.get('code')) document.getElementById('code').value = p.get('code');
      if (p.get('no') && p.get('code')) check();
    });
  </script>
</body>
</html>
