<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="智農派工派工媒合：撞期排除、人選建議與確認出工名單。">
  <link rel="icon" href="../AgriDispatch/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../AgriDispatch/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../AgriDispatch/apple-touch-icon.png">
  <title>智農派工 AgriDispatch - 派工媒合</title>
  <script src="js/app-config.js"></script>
  <script src="js/api-client.js"></script>
  <script>
    if (window.AgriAuth) window.AgriAuth.requireRole(['admin_tech', 'coop_admin'], 'admin-login.html');
  </script>
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記、圖示、抽屜 -->
  <script src="js/agri-theme.js"></script>
  <!-- Lucide 圖示：本機 vendor 優先，CDN 備援 -->
  <script src="js/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@1.47.0"><\/script>');
    }
  </script>
  <link rel="stylesheet" href="css/agri.css">
</head>
<body class="ad-body ad-has-tabbar min-h-screen flex flex-col">

  <header class="ad-header">
    <div class="ad-container ad-header__inner" style="max-width: 1280px;">
      <a href="admin.html" class="ad-header__brand">
        <span class="ad-header__logo"><i data-lucide="sprout" class="ad-icon"></i></span>
        智農派工
        <span class="ad-header__role">營運後台</span>
      </a>
      <nav class="ad-nav" aria-label="營運工具">
        <a class="ad-nav__link" href="insurance.html">保險登錄</a>
        <a class="ad-nav__link" href="skills.html">技能複核</a>
        <a class="ad-nav__link is-active" href="matching.html">派工媒合</a>
        <a class="ad-nav__link" href="rosters.html">共享班表</a>
        <a class="ad-nav__link" href="leaves.html">請假審核</a>
        <a class="ad-nav__link" href="payroll.html">出勤結算</a>
      </nav>
      <div class="ad-header__actions">
        <button type="button" class="ad-btn ad-btn--ghost ad-btn--sm" data-demo-only onclick="demoNav.open()" aria-label="示範導覽"><i data-lucide="layout-grid" class="ad-icon ad-icon--sm"></i><span class="ad-hide-sm">示範導覽</span></button>
        <a href="admin.html" class="ad-btn ad-btn--secondary ad-btn--sm"><i data-lucide="arrow-left" class="ad-icon ad-icon--sm"></i>回後台</a>
      </div>
    </div>
  </header>

  <nav class="ad-tabbar" aria-label="營運工具">
    <a class="ad-tabbar__item" href="insurance.html"><i data-lucide="shield-check" class="ad-icon"></i>保險登錄</a>
    <a class="ad-tabbar__item" href="skills.html"><i data-lucide="award" class="ad-icon"></i>技能複核</a>
    <a class="ad-tabbar__item is-active" href="matching.html"><i data-lucide="route" class="ad-icon"></i>派工媒合</a>
    <a class="ad-tabbar__item" href="admin.html"><i data-lucide="layout-dashboard" class="ad-icon"></i>後台</a>
  </nav>

  <main class="flex-1 ad-container w-full" style="max-width: 1280px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 20px;">
    <div style="min-width: 0;">
      <h1 class="ad-display">派工媒合</h1>
      <p class="ad-caption" style="margin-top: 6px; max-width: 820px;">系統依「該類別熟手人數 → 資深人數 → 工班評價 → 目前施工中訂單數」排序工班，並建議出工名單（必含一位領班，名單 ≥ 4 人時保留 1 個培養名額給新進工人）。未完整加保或工作許可過期者不列入名單。最後由合作社確認後儲存。</p>
      <p class="ad-caption" style="margin-top: 6px; color: var(--ad-accent-text); max-width: 820px;">【待確認】排序不使用國籍、性別、年齡；標籤只影響優先順序，不得作為排除特定工人或差別待遇的依據。</p>
    </div>

    <div class="ad-card" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px;">
      <label for="orderSel" class="ad-label">選擇訂單</label>
      <select id="orderSel" onchange="loadOrder()" class="ad-select" style="flex: 1; min-width: 220px;"></select>
    </div>

    <div id="loadError" class="ad-notice ad-notice--danger" role="alert" hidden></div>
    <div id="orderBox"></div>

    <div class="grid lg:grid-cols-12 gap-6">
      <section class="lg:col-span-5" style="display: flex; flex-direction: column; gap: 12px;">
        <h2 class="ad-title">1. 工班排序</h2>
        <div id="teams" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </section>
      <section class="lg:col-span-7" style="display: flex; flex-direction: column; gap: 12px;">
        <h2 class="ad-title">2. 出工名單 <span id="crewTeam" class="ad-caption" style="font-weight: 400;"></span></h2>
        <div id="crew" style="display: flex; flex-direction: column; gap: 8px;"></div>
        <div id="crewFooter"></div>
      </section>
    </div>
  </main>

  <script>
    const base = () => (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';
    let rec = null;
    let crewData = null;
    let crewTeamId = null;

    // 後端標籤名稱可能帶 emoji，介面上不顯示
    const plain = s => String(s == null ? '' : s).replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu, '').trim();
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    async function api(path, options) {
      const res = await fetch(`${base()}${path}`, options);
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.success === false) throw new Error(body.error || `HTTP ${res.status}`);
      return body.data;
    }
    function showError(msg) {
      const el = document.getElementById('loadError');
      el.textContent = msg;
      el.hidden = !msg;
    }

    async function init() {
      try {
        const orders = (await api('/orders')).filter(o => ['pending', 'confirmed', 'in_progress'].includes(o.status));
        orders.sort((a, b) => a.id.localeCompare(b.id));
        const labels = { pending: '待付定金', confirmed: '已排定', in_progress: '施工中' };
        const sel = document.getElementById('orderSel');
        sel.innerHTML = orders.map(o => `<option value="${esc(o.id)}">${esc(o.id)}・${esc(o.cropName)}・${esc(o.categoryName)}・${labels[o.status]}</option>`).join('');
        const want = new URLSearchParams(location.search).get('order');
        if (want && orders.some(o => o.id === want)) sel.value = want;
        loadOrder();
      } catch (e) {
        showError(`無法載入訂單：${e.message}（請確認後端 3000 已啟動，且以管理員身分登入）`);
      }
    }

    async function loadOrder() {
      showError('');
      const id = document.getElementById('orderSel').value;
      try {
        rec = await api(`/matching/orders/${encodeURIComponent(id)}`);
      } catch (e) {
        showError(`無法取得媒合建議：${e.message}`);
        return;
      }
      const o = rec.order;
      document.getElementById('orderBox').innerHTML = `
        <div class="ad-card" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 16px;">
          <span><span class="ad-caption">訂單</span> <span class="ad-num" style="color: var(--ad-accent-text); font-weight: 600;">${esc(o.orderId)}</span>（${esc(o.statusLabel)}）</span>
          <span><span class="ad-caption">農場</span> ${esc(o.farmerName)}</span>
          <span><span class="ad-caption">作業</span> ${esc(o.categoryName)}</span>
          <span><span class="ad-caption">需求</span> ${o.suggestedWorkers} 人${o.timeSlot && o.timeSlot !== 'full_day' ? `・<strong>${esc(o.timeSlotLabel || o.timeSlot)}</strong>` : ''}</span>
          ${o.preferredWorkerId ? `<span><span class="ad-caption">農場主指名</span> <strong>${esc(o.preferredWorkerName || '')}</strong> <span class="ad-num">${esc(o.preferredWorkerId)}</span></span>` : ''}
          <span><span class="ad-caption">依據技能</span> ${esc(plain(o.skillLabel) || '證照類（不依經驗標籤）')}</span>
          <span><span class="ad-caption">目前派工</span> ${esc(o.assignedTeamId || '—')}${o.crew.length ? `・名單 ${o.crew.length} 人` : '・尚無出工名單'}</span>
          <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;"><span class="ad-caption">工期</span>
            <input id="pStart" type="date" value="${esc(o.startDate || '')}" aria-label="開工日" class="ad-input" style="height: 36px; width: auto;">
            ～
            <input id="pEnd" type="date" value="${esc(o.endDate || '')}" aria-label="完工日" class="ad-input" style="height: 36px; width: auto;">
            <button type="button" onclick="savePeriod()" class="ad-btn ad-btn--secondary ad-btn--sm">儲存工期</button>
            <span id="periodMsg" class="ad-caption" role="status"></span>
          </span>
        </div>`;
      renderTeams();
      if (rec.crew) { crewTeamId = rec.crew.teamId; crewData = rec.crew; renderCrew(); }
    }

    function renderTeams() {
      document.getElementById('teams').innerHTML = rec.teams.map(t => `
        <div class="ad-card${t.teamId === crewTeamId ? ' is-selected' : ''}" style="padding: 16px; ${t.teamId === crewTeamId ? 'border-color: var(--ad-primary); background: var(--ad-primary-soft);' : ''} ${t.eligible ? '' : 'opacity: .7;'}">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
            <div>
              <div class="ad-heading" style="font-size: 15px;">#${t.rank} ${esc(t.teamName)}</div>
              <div class="ad-caption">${t.eligibleMembers}/${t.members} 人可出工</div>
            </div>
            ${t.eligible
              ? `<button type="button" data-team="${esc(t.teamId)}" onclick="pickTeam(this.dataset.team)" class="ad-btn ad-btn--secondary ad-btn--sm" style="flex-shrink: 0;">選這個工班</button>`
              : '<span class="ad-pill ad-pill--danger" style="flex-shrink: 0;">不符資格</span>'}
          </div>
          <ul class="ad-caption" style="margin: 8px 0 0; padding: 0; list-style: none; color: var(--ad-text-2);">${t.reasons.map(r => `<li>・${esc(plain(r))}</li>`).join('')}</ul>
          ${t.blockers.length ? `<div class="ad-caption" style="margin-top: 4px; color: var(--ad-danger-text);">${t.blockers.map(b => esc(plain(b))).join('；')}</div>` : ''}
        </div>`).join('');
    }

    async function savePeriod() {
      const msg = document.getElementById('periodMsg');
      const startDate = document.getElementById('pStart').value;
      const endDate = document.getElementById('pEnd').value;
      if (!startDate || !endDate) { msg.innerHTML = '<span style="color: var(--ad-danger-text);">請填開工與完工日</span>'; return; }
      try {
        await api(`/orders/${encodeURIComponent(rec.order.orderId)}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ startDate, endDate })
        });
        await loadOrder();
        document.getElementById('periodMsg').innerHTML = '<span style="color: var(--ad-primary-text);">已更新工期，排序與名單已重新計算</span>';
      } catch (e) {
        msg.innerHTML = `<span style="color: var(--ad-danger-text);">${esc(e.message)}</span>`;
      }
    }

    async function pickTeam(teamId) {
      try {
        crewData = await api(`/matching/orders/${encodeURIComponent(rec.order.orderId)}/crew?teamId=${encodeURIComponent(teamId)}`);
        crewTeamId = teamId;
        renderTeams();
        renderCrew();
      } catch (e) {
        showError(`無法取得出工名單建議：${e.message}`);
      }
    }

    function roleBadge(c) {
      if (!c.role) return '';
      const cls = c.role === '標籤暫停中' ? 'ad-pill ad-pill--danger'
        : c.role.startsWith('農場主指名') ? 'ad-pill ad-pill--warn'
        : (c.role === '帶隊領班' || c.role === '培養名額') ? 'ad-pill'
        : 'ad-pill ad-pill--ok';
      return `<span class="${cls}">${esc(c.role)}</span>`;
    }

    function renderCrew() {
      const d = crewData;
      document.getElementById('crewTeam').textContent = `・${d.teamId}・需求 ${d.needed} 人${d.periodChecked ? '・已排除工期撞期者' : ''}`;
      // 已有名單且是同一工班時沿用；否則採用系統建議
      const useCurrent = d.currentCrew.length && rec.order.assignedTeamId === d.teamId;
      const checked = new Set(useCurrent ? d.currentCrew : d.candidates.filter(c => c.recommended).map(c => c.workerId));
      document.getElementById('crew').innerHTML = d.candidates.map(c => `
        <label class="ad-choice" style="align-items: center;${c.recommended ? ' border-color: var(--ad-primary);' : ''}">
          <input type="checkbox" value="${esc(c.workerId)}" ${checked.has(c.workerId) ? 'checked' : ''} onchange="updateCount()">
          <div style="flex: 1; min-width: 0;">
            <div class="ad-heading" style="font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">${esc(c.name)} <span class="ad-caption ad-num" style="font-weight: 400;">${esc(c.workerId)}</span>${c.leader ? '<span class="ad-pill">領班</span>' : ''} ${roleBadge(c)}</div>
            <div class="ad-caption">${esc(plain(c.levelLabel))}・同類 ${c.hours} 小時・領班評「優」${Math.round(c.excellentRate * 100)}%・「需加強」${Math.round(c.needsImprovementRate * 100)}%</div>
          </div>
          ${c.recommended ? '<span class="ad-caption" style="color: var(--ad-primary-text); flex-shrink: 0;">系統建議</span>' : ''}
        </label>`).join('') + (d.excluded.length ? `
        <div class="ad-card ad-card--inset ad-caption" style="padding: 12px;">
          <div class="ad-heading" style="font-size: 14px; margin-bottom: 4px;">不列入名單（資格不符）</div>
          ${d.excluded.map(c => `<div>・${esc(c.name)}（${esc(c.workerId)}）：${esc(plain(c.excludedReason))}</div>`).join('')}
        </div>` : '');
      document.getElementById('crewFooter').innerHTML = `
        <div class="ad-card" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px;">
          <div class="ad-caption"><span id="crewCount" class="ad-heading"></span>${d.preferredWarning ? `<div style="color: var(--ad-danger-text);">${esc(d.preferredWarning)}</div>` : ''}${d.shortage ? `<div style="color: var(--ad-danger-text);">合格人數不足，缺 ${d.shortage} 人</div>` : ''}${d.periodChecked ? '' : '<div style="color: var(--ad-accent-text);">此訂單尚未排定工期，無法檢查工人是否撞期</div>'}<div id="saveMsg" role="status"></div></div>
          <button type="button" id="saveBtn" onclick="saveCrew()" class="ad-btn ad-btn--primary">確認派工並儲存</button>
        </div>`;
      updateCount();
    }

    function selected() {
      return [...document.querySelectorAll('#crew input[type=checkbox]:checked')].map(i => i.value);
    }
    function updateCount() {
      const n = selected().length;
      const need = crewData.needed;
      const el = document.getElementById('crewCount');
      el.textContent = `已選 ${n} / ${need} 人`;
      el.className = 'ad-heading';
      el.style.color = n === need ? 'var(--ad-primary-text)' : 'var(--ad-accent-text)';
    }

    async function saveCrew() {
      const crew = selected();
      const msg = document.getElementById('saveMsg');
      if (!crew.length) { msg.innerHTML = '<span style="color: var(--ad-danger-text);">請至少選 1 位工人</span>'; return; }
      document.getElementById('saveBtn').disabled = true;
      try {
        await api(`/matching/orders/${encodeURIComponent(rec.order.orderId)}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ teamId: crewTeamId, crew })
        });
        await loadOrder();
        document.getElementById('saveMsg').innerHTML = `<span style="color: var(--ad-primary-text);">已派工給 ${esc(crewTeamId)}，出工名單 ${crew.length} 人</span>`;
      } catch (e) {
        msg.innerHTML = `<span style="color: var(--ad-danger-text);">未儲存：${esc(e.message)}</span>`;
        document.getElementById('saveBtn').disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

  <script>
    var demoNav = AgriTheme.demoNav();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
