<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>農場主專屬登入 - 智農派工 AgriDispatch</title>
  <!-- 執行模式設定（demo / production，每份副本各自一份） -->
  <script src="js/app-config.js"></script>
  <!-- API Client：自動帶 token、demo 自動登入、production 401 導向 -->
  <script src="js/api-client.js"></script>
  <script>
    if (window.AGRI_CONFIG && window.AGRI_CONFIG.mode !== 'production') {
      document.write('<script src="js/demo-accounts.js"><\/script>');
    }
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- Vue 3: Local Vendor First with CDN Fallback -->
  <script src="js/vendor/vue.global.prod.js"></script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記 -->
  <script src="js/agri-theme.js"></script>
  <link rel="stylesheet" href="css/agri.css">
  <style>
    [v-cloak] { display: none; }
  </style>
  <script>
    // Failsafe: Remove v-cloak if Vue takes more than 1.5s to prevent blank screen
    setTimeout(function() {
      var appEl = document.getElementById('app');
      if (appEl && appEl.hasAttribute('v-cloak')) {
        console.warn('Vue mounting timed out or offline, removing v-cloak failsafe');
        appEl.removeAttribute('v-cloak');
      }
    }, 1500);
  </script>
</head>
<body class="ad-body">

  <div id="app" v-cloak class="flex flex-col min-h-screen">
    <header class="ad-header">
      <div class="ad-container ad-header__inner">
        <a href="login.html" class="ad-header__brand"><span class="ad-header__logo"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ad-icon"><path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"></path><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"></path><path d="M5 21h14"></path></svg></span>智農派工<span class="ad-header__role">農場主</span></a>
        <div class="ad-header__actions">
          <a v-if="isDemo" href="farmer.html" class="ad-btn ad-btn--ghost ad-btn--sm ad-hide-sm">免登入預約</a>
          <a href="login.html" class="ad-btn ad-btn--ghost ad-btn--sm">切換身分</a>
        </div>
      </div>
    </header>

    <main class="ad-auth">
      <div class="ad-card ad-auth__card">
        <h1 class="ad-title">農場主登入</h1>
        <p class="ad-caption" style="margin: 4px 0 20px;">輸入農場主帳號、手機號碼或農民代號。</p>

            <div v-if="isDemo && demoCfg" class="ad-notice ad-notice--ok" style="margin-bottom: 16px; align-items: center; justify-content: space-between;">
              <div style="min-width: 0;">
                <div style="font-weight: 600;">{{ demoCfg.bannerNotice }}</div>
                <div class="ad-caption" style="color: inherit;">免控管帳密，任意輸入或直接點擊都能進入實測。</div>
              </div>
              <a href="farmer.html" class="ad-btn ad-btn--secondary ad-btn--sm" style="flex-shrink: 0;">直通工作台</a>
            </div>
            <div v-if="errorMsg" class="ad-notice ad-notice--danger" role="alert" style="margin-bottom: 16px;">{{ errorMsg }}</div>
            <div v-if="successMsg" class="ad-notice ad-notice--ok" role="status" style="margin-bottom: 16px;">{{ successMsg }}</div>

            <form @submit.prevent="handleLogin" style="display: flex; flex-direction: column; gap: 16px;">
              <div class="ad-field">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;"><label class="ad-label">帳號／手機號碼／農民代號</label></div>
                <input v-model="form.identifier" type="text" :placeholder="isDemo && demoCfg ? demoCfg.idPlaceholder : '請輸入農場主帳號或手機號碼'" autocomplete="username" class="ad-input">
              </div>
              <div class="ad-field">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;"><label class="ad-label">密碼</label><a href="#" @click.prevent="alertHelp" class="ad-caption" style="color: var(--ad-primary-text);">忘記密碼？</a></div>
                <input v-model="form.password" type="password" :placeholder="isDemo && demoCfg ? demoCfg.pwdPlaceholder : '請輸入密碼'" autocomplete="current-password" class="ad-input">
              </div>
              <p v-if="isDemo && demoCfg" class="ad-caption" style="margin: -8px 0 0;">{{ demoCfg.pwdHint }}</p>
              <button type="submit" :disabled="loading" class="ad-btn ad-btn--primary ad-btn--lg ad-btn--block" style="margin-top: 4px;">{{ loading ? '登入中…' : '登入' }}</button>
            </form>

            <div v-if="isDemo && demoCfg" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--ad-border);">
              <div class="ad-label" style="margin-bottom: 8px;">示範帳號（點一下直接填入）</div>
              <div class="ad-list">
                <button v-for="p in demoCfg.profiles" :key="p.identifier" @click="fillProfile(p.identifier, p.password)" type="button" class="ad-row">
                  <div class="ad-row__main">
                    <div class="ad-row__title">{{ p.name }}</div>
                    <div class="ad-row__meta">{{ p.desc }}</div>
                  </div>
                  <span class="ad-pill">{{ p.tag }}</span>
                </button>
              </div>
            </div>

        <p class="ad-caption" style="margin-top: 20px; text-align: center;">
          不是農場主？<a href="worker-foreign-login.html" style="color: var(--ad-primary-text);">我是外籍移工</a>・<a href="worker-local-login.html" style="color: var(--ad-primary-text);">我是本國工作人員</a>
        </p>
      </div>
    </main>

    <footer class="ad-caption" style="border-top: 1px solid var(--ad-border); padding: 16px; text-align: center;">
      © 2026 智農派工 AgriDispatch
    </footer>
  </div>

  <script>
    const { createApp, ref, reactive } = Vue;

    createApp({
      setup() {
        const API_BASE = window.AgriAuth ? window.AgriAuth.API_BASE : (window.location.origin.startsWith('http')
          ? `${window.location.origin}/api`
          : 'http://localhost:3000/api');
        const isDemo = window.AgriAuth ? window.AgriAuth.MODE !== 'production' : true;
        const demoCfg = (window.AGRI_DEMO_ACCOUNTS && window.AGRI_DEMO_ACCOUNTS.farmer) || null;

        const form = reactive({
          identifier: isDemo && demoCfg ? demoCfg.defaultIdentifier : '',
          password: isDemo && demoCfg ? demoCfg.defaultPassword : ''
        });
        const rememberMe = ref(true);
        const loading = ref(false);
        const errorMsg = ref('');
        const successMsg = ref('');

        const fillProfile = (identifier, password) => {
          form.identifier = identifier;
          form.password = password;
          errorMsg.value = '';
          if (window.AgriNativeBridge && typeof window.AgriNativeBridge.vibrate === 'function') {
            window.AgriNativeBridge.vibrate(50);
          }
        };

        const handleLogin = async () => {
          errorMsg.value = '';
          successMsg.value = '';
          loading.value = true;

          if (!isDemo) {
            // production 模式：一律呼叫真實登入 API，失敗顯示錯誤、不做任何離線 fallback
            try {
              const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: form.identifier, password: form.password })
              });
              const data = await res.json().catch(() => null);
              if (res.ok && data && data.success && data.user) {
                window.AgriAuth.setSession(data.token, data.user);
                sessionStorage.setItem('farmerUser', JSON.stringify(data.user));
                successMsg.value = `歡迎回來，${data.user.name}！正在為您開啟農場主工作台...`;
                setTimeout(() => { window.location.href = 'farmer.html'; }, 500);
              } else {
                errorMsg.value = (data && data.error) || '帳號或密碼錯誤';
              }
            } catch (e) {
              errorMsg.value = '無法連線到伺服器，請稍後再試';
            } finally {
              loading.value = false;
            }
            return;
          }

          // Demo 版免控管帳密，一律通行實測
          const isYilan = form.identifier && (form.identifier.includes('yilan') || form.identifier.includes('春發'));
          const defaultUser = isYilan ? {
            id: 'FARMER-002',
            name: '李春發 (春發伯)',
            role: 'FARMER',
            phone: '0921-888-999',
            farmName: '宜蘭三星青蔥專班',
            farmArea: '8.2 分地',
            token: 'demo-farmer-token-2026'
          } : {
            id: 'FARMER-001',
            name: (form.identifier && form.identifier !== 'farmer') ? form.identifier : '陳建龍 (阿龍班長)',
            role: 'FARMER',
            phone: '0912-345-678',
            farmName: '桃園八德有機蔬菜班',
            farmArea: '5.0 分地',
            token: 'demo-farmer-token-2026'
          };

          let finalUser = defaultUser;

          // 嘗試後端驗證（若後端運作則同步資料；若離線或帳密不符亦不阻擋 Demo 體驗）
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); // 後端 PBKDF2 驗證約 1~1.5 秒
            const res = await fetch(`${API_BASE}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                identifier: form.identifier || (demoCfg && demoCfg.defaultIdentifier) || 'farmer',
                password: form.password || (demoCfg && demoCfg.defaultPassword) || ''
              }),
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (res.ok) {
              const data = await res.json();
              if (data && data.success && data.user) {
                finalUser = data.user;
              }
            }
          } catch (e) {
            // Demo 離線靜默容錯，不報錯
          }

          successMsg.value = `歡迎回來，${finalUser.name}！正在為您開啟農場主工作台...`;
          sessionStorage.setItem('agri_user', JSON.stringify(finalUser));
          sessionStorage.setItem('farmerUser', JSON.stringify(finalUser));
          sessionStorage.setItem('agri_token', finalUser.token || 'demo-farmer-token-2026');

          if (window.AgriNativeBridge) {
            if (typeof window.AgriNativeBridge.showToast === 'function') {
              window.AgriNativeBridge.showToast(`歡迎回來，${finalUser.name}！`);
            }
            if (typeof window.AgriNativeBridge.vibrate === 'function') {
              window.AgriNativeBridge.vibrate(80);
            }
          }

          setTimeout(() => {
            window.location.href = 'farmer.html';
          }, 600);
        };

        const alertHelp = () => {
          (window.AgriUtil ? window.AgriUtil.toast : (t, m) => alert(`${t}\n${m}`))('需要協助？', '如忘記密碼或欲開通契作農場主帳號，請撥打合作社專線：(03) 388-1234 或聯絡LINE官方客服。');
        };

        return {
          form,
          rememberMe,
          loading,
          errorMsg,
          successMsg,
          isDemo,
          demoCfg,
          fillProfile,
          handleLogin,
          alertHelp
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
