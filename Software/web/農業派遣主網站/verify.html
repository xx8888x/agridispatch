<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智農派工 AgriDispatch - 合法用工證明查驗</title>
  <script src="js/app-config.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">
  <main class="flex-1 w-full max-w-lg mx-auto px-4 py-12 space-y-6">
    <div class="text-center space-y-2">
      <div class="text-4xl">🔍</div>
      <h1 class="text-2xl font-black text-white">合法用工證明查驗</h1>
      <p class="text-sm text-slate-400">輸入證明書上的證明編號與查驗碼，確認證明為平台產製且內容未遭竄改。</p>
    </div>

    <form onsubmit="event.preventDefault(); check();" class="p-5 rounded-3xl bg-slate-900 border border-slate-800 space-y-3">
      <div>
        <label for="no" class="block text-xs font-semibold text-slate-300 mb-1">證明編號</label>
        <input id="no" type="text" required placeholder="LEC-ORD-2026-013" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono uppercase">
      </div>
      <div>
        <label for="code" class="block text-xs font-semibold text-slate-300 mb-1">查驗碼（12 碼）</label>
        <input id="code" type="text" required maxlength="12" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono uppercase tracking-widest">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm transition">查驗</button>
    </form>

    <div id="result"></div>

    <p class="text-[11px] text-slate-500 text-center leading-relaxed">查驗結果只顯示證明摘要，不顯示工人個人資料。證明內容更新後舊查驗碼即失效。</p>
  </main>

  <script>
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function check() {
      const no = document.getElementById('no').value.trim().toUpperCase();
      const code = document.getElementById('code').value.trim().toUpperCase();
      const box = document.getElementById('result');
      box.innerHTML = '<p class="text-sm text-slate-400 text-center">查驗中…</p>';
      const base = (window.AgriAuth && window.AgriAuth.API_BASE) || '/api';
      try {
        const res = await fetch(`${base}/public/certificates/${encodeURIComponent(no)}?code=${encodeURIComponent(code)}`);
        const body = await res.json();
        if (!res.ok || body.success === false) throw new Error(body.error || `HTTP ${res.status}`);
        const d = body.data;
        box.innerHTML = d.valid ? `
          <div class="p-5 rounded-3xl bg-emerald-950/50 border-2 border-emerald-500/60 space-y-2">
            <div class="text-lg font-black text-emerald-300">✅ 證明有效</div>
            <dl class="text-sm grid grid-cols-3 gap-y-1">
              <dt class="text-slate-400">證明編號</dt><dd class="col-span-2 font-mono">${esc(d.certificateNo)}</dd>
              <dt class="text-slate-400">開立單位</dt><dd class="col-span-2">${esc(d.issuer)}</dd>
              <dt class="text-slate-400">用工單位</dt><dd class="col-span-2">${esc(d.farmerName)}</dd>
              <dt class="text-slate-400">作物／項目</dt><dd class="col-span-2">${esc(d.cropName)}・${esc(d.categoryName)}</dd>
              <dt class="text-slate-400">出勤期間</dt><dd class="col-span-2">${esc(d.periodStart)} 至 ${esc(d.periodEnd)}</dd>
              <dt class="text-slate-400">人數／工時</dt><dd class="col-span-2">${esc(d.workerCount)} 人／${esc(d.totalHours)} 小時</dd>
            </dl>
          </div>` : `
          <div class="p-5 rounded-3xl bg-rose-950/50 border-2 border-rose-500/60">
            <div class="text-lg font-black text-rose-300">⛔ 查驗未通過</div>
            <p class="text-sm text-rose-200 mt-1">${esc(d.reason || '查驗碼不符')}</p>
          </div>`;
      } catch (e) {
        box.innerHTML = `<p class="text-sm text-rose-300 text-center">無法連線查驗服務：${esc(e.message)}</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(location.search);
      if (p.get('no')) document.getElementById('no').value = p.get('no');
      if (p.get('code')) document.getElementById('code').value = p.get('code');
      if (p.get('no') && p.get('code')) check();
    });
  </script>
</body>
</html>
