# demo 模式（路演展示）：--spring.profiles.active=demo
# 免密示範登入、示範帳號清單、/api/dev/** 重灌資料、H2 console（僅本機）
agri:
  demo:
    enabled: true
  # 路演可隨時示範 LINE 推播；正式環境的工作者帳號推播時段見 application.yml【待確認】
  line:
    notify:
      worker-hours: 00:00-24:00

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
