<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科技營運與調度管理後台登入 - 智農派工 AgriDispatch</title>
  <!-- 執行模式設定（demo / production，每份副本各自一份） -->
  <script src="js/app-config.js"></script>
  <!-- API Client：自動帶 token、demo 自動登入、production 401 導向 -->
  <script src="js/api-client.js"></script>
  <script>
    if (window.AGRI_CONFIG && window.AGRI_CONFIG.mode !== 'production') {
      document.write('<script src="js/demo-accounts.js"><\/script>');
    }
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="js/vendor/tailwindcss-3.4.17.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>');
    }
  </script>
  <!-- Vue 3: Local Vendor First with CDN Fallback -->
  <script src="js/vendor/vue.global.prod.js"></script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>');
    }
  </script>
  <!-- 設計系統：共用 tailwind.config、demo 模式標記 -->
  <script src="js/agri-theme.js"></script>
  <link rel="stylesheet" href="css/agri.css">
  <style>
    [v-cloak] { display: none; }
  </style>
  <script>
    // Failsafe: Remove v-cloak if Vue takes more than 1.5s to prevent blank screen
    setTimeout(function() {
      var appEl = document.getElementById('app');
      if (appEl && appEl.hasAttribute('v-cloak')) {
        console.warn('Vue mounting timed out or offline, removing v-cloak failsafe');
        appEl.removeAttribute('v-cloak');
      }
    }, 1500);
  </script>
</head>
<body class="ad-body">

  <div id="app" v-cloak class="flex flex-col min-h-screen">
    <header class="ad-header">
      <div class="ad-container ad-header__inner">
        <a href="../農業派遣主網站/login.html" class="ad-header__brand"><span class="ad-header__logo"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ad-icon"><path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"></path><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"></path><path d="M5 21h14"></path></svg></span>智農派工<span class="ad-header__role">營運後台</span></a>
        <div class="ad-header__actions">
          <a v-if="isDemo" href="admin.html" class="ad-btn ad-btn--ghost ad-btn--sm ad-hide-sm">直通後台</a>
          <a href="../農業派遣主網站/login.html" class="ad-btn ad-btn--ghost ad-btn--sm">切換身分</a>
        </div>
      </div>
    </header>

    <main class="ad-auth">
      <div class="ad-card ad-auth__card">
        <h1 class="ad-title">管理人員登入</h1>
        <p class="ad-caption" style="margin: 4px 0 20px;">科技代管與合作社調度人員使用。</p>

        <div v-if="isDemo && demoCfg" class="ad-notice ad-notice--ok" style="margin-bottom: 16px; align-items: center; justify-content: space-between;">
          <div style="min-width: 0;">
            <div style="font-weight: 600;">{{ demoCfg.bannerNotice }}</div>
            <div class="ad-caption" style="color: inherit;">{{ demoCfg.bannerHint }}</div>
          </div>
          <a href="admin.html" class="ad-btn ad-btn--secondary ad-btn--sm" style="flex-shrink: 0;">直通後台</a>
        </div>

        <div v-if="isDemo && demoCfg" style="margin-bottom: 20px;">
          <div class="ad-label" style="margin-bottom: 8px;">示範權限（點一下直接填入）</div>
          <div class="ad-list">
            <button v-for="p in demoCfg.profiles" :key="p.key" @click="fillAdmin(p.key)" type="button" class="ad-row">
              <div class="ad-row__main">
                <div class="ad-row__title">{{ p.label }}</div>
                <div class="ad-row__meta">{{ p.email }}</div>
              </div>
            </button>
          </div>
        </div>

        <form @submit.prevent="handleLogin" style="display: flex; flex-direction: column; gap: 16px;">
          <div v-if="errorMsg" class="ad-notice ad-notice--danger" role="alert">{{ errorMsg }}</div>

          <div class="ad-field">
            <label class="ad-label">管理員帳號／電子郵件</label>
            <input v-model="form.email" type="text" placeholder="admin@agridispatch.tw" autocomplete="username" class="ad-input">
          </div>
          <div class="ad-field">
            <label class="ad-label">密碼</label>
            <input v-model="form.password" type="password" placeholder="請輸入密碼" autocomplete="current-password" class="ad-input">
          </div>

          <!-- 組織與動態碼只在示範模式用來切換示範帳號；正式登入只送帳號與密碼，不顯示這兩個欄位 -->
          <div v-if="isDemo" class="ad-form-grid ad-form-grid--2">
            <div class="ad-field">
              <label class="ad-label">所屬組織（示範）</label>
              <select v-model="form.org" class="ad-select">
                <option value="tech">智農科技代管公司</option>
                <option value="coop">外展農業合作社</option>
                <option value="moa">農業部法規稽核組</option>
              </select>
            </div>
            <div class="ad-field">
              <label class="ad-label">動態碼（示範）</label>
              <input v-model="form.otp" type="text" inputmode="numeric" placeholder="6 碼" class="ad-input ad-num">
            </div>
          </div>

          <button type="submit" :disabled="loading" class="ad-btn ad-btn--primary ad-btn--lg ad-btn--block" style="margin-top: 4px;">{{ loading ? '驗證中…' : '登入' }}</button>
        </form>
      </div>
    </main>

    <footer class="ad-caption" style="border-top: 1px solid var(--ad-border); padding: 16px; text-align: center;">
      © 2026 智農派工 AgriDispatch
    </footer>
  </div>

  <script>
    const { createApp, ref } = Vue;
    const isDemo = window.AgriAuth ? window.AgriAuth.MODE !== 'production' : true;
    const demoCfg = (window.AGRI_DEMO_ACCOUNTS && window.AGRI_DEMO_ACCOUNTS.admin) || null;

    createApp({
      setup() {
        const loading = ref(false);
        const errorMsg = ref('');
        const form = ref({
          email: '',
          password: '',
          org: 'tech',
          otp: '',
          remember: true
        });

        const fillAdmin = (key) => {
          if (!demoCfg) return;
          const p = demoCfg.profiles.find(x => x.key === key);
          if (!p) return;
          form.value.email = p.email;
          form.value.password = p.password;
          form.value.org = p.org;
          form.value.otp = p.otp;
        };

        const handleLogin = async () => {
          errorMsg.value = '';
          loading.value = true;

          if (!isDemo) {
            // production 模式：一律呼叫真實登入 API，失敗不導向、顯示錯誤
            try {
              const res = await fetch(`${window.AgriAuth.API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: form.value.email, password: form.value.password })
              });
              const data = await res.json().catch(() => null);
              if (res.ok && data && data.success && data.user) {
                window.AgriAuth.setSession(data.token, data.user);
                window.location.href = 'admin.html';
              } else {
                errorMsg.value = (data && data.error) || '帳號或密碼錯誤';
              }
            } catch (e) {
              errorMsg.value = '無法連線到伺服器，請稍後再試';
            } finally {
              loading.value = false;
            }
            return;
          }

          // demo 模式：維持既有快速展示體驗，後端在線則同步真實 token/user
          const org = form.value.org || 'tech';
          const email = form.value.email || (demoCfg && demoCfg.profiles[0].email) || 'admin@agridispatch.tw';
          const matched = demoCfg && demoCfg.profiles.find(p => p.email === email);
          let finalUser = {
            username: email,
            email: email,
            org: org,
            name: (matched && matched.name) || (org === 'tech' ? '林技術長 (Tech Lead)' : (org === 'coop' ? '陳理事長 (Coop Chair)' : '張稽核專員')),
            role: 'admin_tech',
            demo: true
          };
          let token = 'demo-admin-token-2026';

          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); // 後端 PBKDF2 驗證約 1~1.5 秒
            const res = await fetch(`${window.AgriAuth.API_BASE}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identifier: email, password: form.value.password || (matched && matched.password) || '' }),
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (res.ok) {
              const data = await res.json();
              if (data && data.success && data.user) {
                finalUser = data.user;
                token = data.token || token;
              }
            }
          } catch (e) {
            // Demo 離線容錯，沿用本地假資料
          }

          sessionStorage.setItem('agri_admin_user', JSON.stringify(finalUser));
          window.AgriAuth.setSession(token, finalUser);
          setTimeout(() => { window.location.href = 'admin.html'; }, 300);
        };

        return {
          form,
          loading,
          errorMsg,
          isDemo,
          demoCfg,
          fillAdmin,
          handleLogin
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
